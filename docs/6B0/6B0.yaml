disturbo: Disturbi legati all'ansia o alla paura
livello: 1
descrizione: >
    I disturbi d'ansia e paura sono caratterizzati da paura e ansia eccessive e disturbi comportamentali correlati, con sintomi sufficientemente gravi da causare disagio significativo o compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Paura e ansia sono fenomeni strettamente correlati; la paura rappresenta una reazione alla minaccia imminente percepita nel presente, mentre l'ansia è più orientata al futuro, riferendosi alla minaccia anticipata percepita. 
    Una caratteristica chiave di differenziazione tra i disturbi d'ansia e paura sono i focolai di apprensione specifici del disturbo, ovvero lo stimolo o la situazione che scatena la paura o l'ansia. 
    La presentazione clinica dei disturbi d'ansia e paura include in genere specifiche cognizioni associate che possono aiutare a differenziare i disturbi chiarendo il focus dell'apprensione.
requisiti diagnostici: >
    I disturbi d'ansia o correlati alla paura sono caratterizzati da paura e ansia eccessive e disturbi comportamentali correlati, con sintomi sufficientemente gravi da causare disagio significativo o compromissione del funzionamento. 
    Paura e ansia sono fenomeni strettamente correlati; la paura rappresenta una reazione alla minaccia imminente percepita nel presente, mentre l'ansia è più orientata al futuro, riferendosi alla minaccia anticipata percepita. 
    Uno dei principali modi in cui i diversi disturbi d'ansia o correlati alla paura si distinguono tra loro è il focus dell'apprensione, ovvero gli stimoli o le situazioni che scatenano la paura o l'ansia. 
    Il focus dell'apprensione può essere altamente specifico come nella fobia specifica o riguardare una classe più ampia di situazioni come nel disturbo d'ansia generalizzato. 
    La presentazione clinica dei disturbi d'ansia o correlati alla paura include in genere specifiche cognizioni associate che possono aiutare a differenziare i disturbi chiarendo il focus dell'apprensione.
sottocategorie:
  - Disturbo d'ansia generalizzato
  - Disturbo di panico
  - Agorafobia
  - Fobia specifica
  - Disturbo d'ansia sociale
  - Disturbo d'ansia da separazione
  - Mutismo selettivo