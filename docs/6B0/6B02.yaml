disturbo: Agorafobia
codice: 6B02 
gruppo_superiore: Disturbi legati all'ansia o alla paura
livello: 2
descrizione: >
    L'agorafobia è caratterizzata da una marcata ed eccessiva paura o ansia che si manifesta in risposta a molteplici situazioni in cui potrebbe essere difficile fuggire o in cui potrebbe non essere disponibile aiuto, come usare i mezzi pubblici, trovarsi in mezzo alla folla, trovarsi da soli fuori casa (ad esempio, nei negozi, a teatro, in coda). 
    L'individuo è costantemente ansioso per queste situazioni a causa della paura di specifici esiti negativi (ad esempio, attacchi di panico, altri sintomi fisici invalidanti o imbarazzanti). 
    Le situazioni vengono attivamente evitate, affrontate solo in circostanze specifiche come in presenza di un compagno fidato, o sopportate con intensa paura o ansia. 
    I sintomi persistono per almeno diversi mesi e sono sufficientemente gravi da causare un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Paura o ansia marcate ed eccessive che si manifestano in, o in previsione di, molteplici situazioni in cui potrebbe essere difficile fuggire o potrebbe non essere disponibile aiuto, come quando si usano i mezzi pubblici, ci si trova in mezzo alla folla, ci si trova da soli fuori casa, nei negozi, a teatro o in coda.
    L'individuo è costantemente spaventato o ansioso riguardo a queste situazioni a causa della paura di specifici esiti negativi, come attacchi di panico, sintomi di panico o altri sintomi fisici debilitanti (ad esempio cadute) o imbarazzanti (ad esempio incontinenza).
    Le situazioni vengono evitate attivamente, vi si accede solo in circostanze specifiche (ad esempio, in presenza di un compagno) oppure vengono sopportate con intensa paura o ansia.
    I sintomi non sono transitori, cioè persistono per un periodo di tempo prolungato (ad esempio, almeno diversi mesi).
    I sintomi non sono meglio spiegabili con un altro disturbo mentale (ad esempio, ideazione paranoica nel disturbo delirante; ritiro sociale nei disturbi depressivi).
    I sintomi provocano un disagio significativo dovuto alla presenza di sintomi d'ansia persistenti o a una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.
