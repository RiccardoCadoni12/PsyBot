disturbo: Disturbo d'ansia generalizzato
codice: 6B00 
gruppo_superiore: Disturbi legati all'ansia o alla paura
livello: 2
descrizione: >
    Il disturbo d'ansia generalizzato è caratterizzato da sintomi d'ansia marcati che persistono per almeno diversi mesi, per la maggior parte dei giorni, manifestati da apprensione generale (ovvero "ansia fluttuante") o preoccupazione eccessiva focalizzata su molteplici eventi quotidiani, il più delle volte riguardanti la famiglia, la salute, le finanze, la scuola o il lavoro, insieme a sintomi aggiuntivi come tensione muscolare o irrequietezza motoria, iperattività del sistema nervoso simpatico, esperienza soggettiva di nervosismo, difficoltà a mantenere la concentrazione, irritabilità o disturbi del sonno. I sintomi provocano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    I sintomi non sono una manifestazione di un'altra condizione di salute e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale.
requisiti diagnostici: >
    Sintomi marcati di ansia manifestati da:
    Apprensione generale che non è limitata a nessuna particolare circostanza ambientale (ad esempio, "ansia fluttuante"); 
    Preoccupazione eccessiva (aspettativa apprensiva) riguardo a eventi negativi che si verificano in diversi aspetti della vita quotidiana (ad esempio, lavoro, finanze, salute, famiglia).
    L'ansia e l'apprensione o preoccupazione generale sono accompagnate da ulteriori sintomi caratteristici, quali:
    Tensione muscolare o irrequietezza motoria.
    Iperattività del sistema nervoso autonomo simpatico evidenziata da frequenti sintomi gastrointestinali quali nausea e/o disturbi addominali, palpitazioni cardiache, sudorazione, tremori, scosse e/o secchezza delle fauci.
    Esperimento soggettivo di nervosismo, irrequietezza o sensazione di essere "in tensione".
    Difficoltà di concentrazione.
    Irritabilità.
    Disturbi del sonno (difficoltà ad addormentarsi o a rimanere addormentati, oppure sonno agitato e insoddisfacente).
    I sintomi non sono transitori e persistono per almeno diversi mesi, la maggior parte dei quali per giorni.
    I sintomi non sono meglio spiegabili con un altro disturbo mentale (ad esempio un disturbo depressivo).
    I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, ipertiroidismo) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, caffeina, cocaina), compresi gli effetti dell'astinenza (ad esempio, alcol, benzodiazepine).
    I sintomi provocano un disagio significativo dovuto alla presenza di sintomi d'ansia persistenti o a una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.