disturbo:  Disturbo d'ansia da separazione
codice: 6B05
gruppo_superiore: Disturbi legati all'ansia o alla paura
livello: 2
esclusioni:
  - disturbi dell'umore (affettivi) 
  - Mutismo selettivo 
  - Disturbo d'ansia sociale 
descrizione: >
    Il disturbo d'ansia da separazione è caratterizzato da una marcata ed eccessiva paura o ansia riguardo alla separazione da specifiche figure di attaccamento. 
    Nei bambini e negli adolescenti, l'ansia da separazione si concentra tipicamente su chi si prende cura di loro, sui genitori o su altri membri della famiglia e la paura o l'ansia vanno oltre ciò che sarebbe considerato normale dal punto di vista dello sviluppo. 
    Negli adulti, il focus è tipicamente sul partner o sui figli. 
    Le manifestazioni dell'ansia da separazione possono includere pensieri di danno o eventi sfavorevoli che accadono alla figura di attaccamento, riluttanza ad andare a scuola o al lavoro, eccessivo disagio ricorrente al momento della separazione, riluttanza o rifiuto di dormire lontano dalla figura di attaccamento e incubi ricorrenti sulla separazione. 
    I sintomi persistono per almeno diversi mesi e sono sufficientemente gravi da causare un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Paura o ansia marcata ed eccessiva per la separazione dalle persone a cui la persona è legata (ovvero, con cui ha un profondo legame emotivo). 
    Nei bambini e negli adolescenti, le figure di attaccamento chiave che più comunemente sono al centro dell'ansia da separazione includono genitori, caregiver e altri membri della famiglia, e la paura o l'ansia vanno oltre ciò che sarebbe considerato normale dal punto di vista dello sviluppo. 
    Negli adulti, l'ansia da separazione coinvolge più spesso il coniuge, il partner o i figli. Le manifestazioni di paura o ansia legate alla separazione dipendono dal livello di sviluppo dell'individuo, ma possono includere:
    Pensieri persistenti che potrebbero causare danni o altri eventi spiacevoli (ad esempio, essere rapiti) porteranno alla separazione.
    Rifiuto o riluttanza ad andare a scuola o a lavorare.
    Eccessivo disagio ricorrente (ad esempio, capricci, isolamento sociale) correlato alla separazione dalla figura di attaccamento.
    Rifiuto o riluttanza ad addormentarsi senza essere vicino alla figura di attaccamento.
    Incubi ricorrenti sulla separazione.
    Sintomi fisici quali nausea, vomito, mal di stomaco, mal di testa, in occasioni che comportano la separazione dalla figura di attaccamento, come uscire di casa per andare a scuola o al lavoro.
    I sintomi non sono transitori, cioè persistono per un periodo di tempo prolungato (ad esempio, almeno diversi mesi).
    I sintomi non sono meglio spiegabili con un altro disturbo mentale (ad esempio, agorafobia, disturbo della personalità).
    I sintomi provocano un disagio significativo dovuto alla presenza di sintomi d'ansia persistenti o a una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.