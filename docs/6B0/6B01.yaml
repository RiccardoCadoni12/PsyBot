disturbo: Disturbo di panico
codice: 6B01 
gruppo_superiore: Disturbi legati all'ansia o alla paura
livello: 2
esclusioni: Attacco di panico 
descrizione: >
    Il disturbo di panico è caratterizzato da attacchi di panico ricorrenti e inaspettati, non limitati a particolari stimoli o situazioni. 
    Gli attacchi di panico sono episodi distinti di intensa paura o apprensione, accompagnati dalla rapida e concomitante comparsa di diversi sintomi caratteristici (ad esempio palpitazioni o aumento della frequenza cardiaca, sudorazione, tremori, respiro corto, dolore toracico, vertigini o stordimento, brividi, vampate di calore, paura di morte imminente). 
    Inoltre, il disturbo di panico è caratterizzato da una preoccupazione persistente per la ricorrenza o l'importanza degli attacchi di panico, o da comportamenti volti a evitarne la ricorrenza, che determina una significativa compromissione del funzionamento personale, familiare, sociale, scolastico, lavorativo o di altre aree importanti. 
    I sintomi non sono una manifestazione di un'altra condizione medica e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale.
requisiti diagnostici: >
    Attacchi di panico ricorrenti, ovvero episodi distinti di intensa paura o apprensione caratterizzati dall'insorgenza rapida e concomitante di diversi sintomi caratteristici. 
    Questi sintomi possono includere, a titolo esemplificativo ma non esaustivo, i seguenti:
    Palpitazioni o aumento della frequenza cardiaca
    Sudorazione
    Tremito
    Sensazioni di mancanza di respiro
    Sensazione di soffocamento
    Dolore al petto
    Nausea o disturbi addominali
    Sensazioni di vertigini o stordimento
    Brividi o vampate di calore
    Formicolio o mancanza di sensibilità alle estremità (ad esempio, parestesie)
    Depersonalizzazione o derealizzazione
    Paura di perdere il controllo o di impazzire
    Paura della morte imminente
    Almeno alcuni degli attacchi di panico sono inaspettati, cioè non sono limitati a particolari stimoli o situazioni, ma sembrano piuttosto insorgere "all'improvviso".
    Gli attacchi di panico sono seguiti da preoccupazione persistente o timore (ad esempio, per diverse settimane) circa la loro ricorrenza o il loro significato negativo percepito (ad esempio, che i sintomi fisiologici possano essere quelli di un infarto del miocardio) o da comportamenti volti a evitarne la ricorrenza (ad esempio, uscire di casa solo con una persona fidata).
    Gli attacchi di panico non si limitano a situazioni che provocano ansia nel contesto di un altro disturbo mentale.
    I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, feocromocitoma) e non sono dovuti agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, caffè, cocaina), compresi gli effetti dell'astinenza (ad esempio, alcol, benzodiazepine).
    I sintomi comportano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.