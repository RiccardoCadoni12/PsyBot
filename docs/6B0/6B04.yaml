disturbo: Disturbo d'ansia sociale
codice: 6B04 
gruppo_superiore: Disturbi legati all'ansia o alla paura
livello: 2
descrizione: >
    Il disturbo d'ansia sociale è caratterizzato da paura o ansia marcate ed eccessive che si verificano costantemente in una o più situazioni sociali, come interazioni sociali (ad esempio, avere una conversazione), fare qualcosa mentre ci si sente osservati (ad esempio, mangiare o bere in presenza di altri) o esibirsi di fronte ad altri (ad esempio, tenere un discorso). 
    L'individuo teme di agire in un modo, o di manifestare sintomi d'ansia, che saranno valutati negativamente dagli altri. 
    Le situazioni sociali rilevanti vengono costantemente evitate o altrimenti sopportate con intensa paura o ansia. 
    I sintomi persistono per almeno diversi mesi e sono sufficientemente gravi da causare un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Paura o ansia marcate ed eccessive che si manifestano costantemente in una o più situazioni sociali, come interazioni sociali (ad esempio, avere una conversazione), fare qualcosa mentre ci si sente osservati (ad esempio, mangiare o bere in presenza di altri) o esibirsi di fronte ad altri (ad esempio, tenere un discorso).
    L'individuo teme di agire in un modo o di mostrare sintomi di ansia che potrebbero essere valutati negativamente dagli altri (ad esempio, essere umilianti, imbarazzanti, portare al rifiuto o risultare offensivi).
    Le situazioni sociali rilevanti vengono sistematicamente evitate o sopportate con intensa paura o ansia.
    I sintomi non sono transitori, ovvero persistono per un periodo di tempo prolungato (ad esempio, almeno diversi mesi).
    I sintomi non sono meglio spiegabili con un altro disturbo mentale (ad esempio, agorafobia, disturbo dismorfico corporeo, disturbo da riferimento olfattivo).
    I sintomi provocano un disagio significativo dovuto alla presenza di sintomi d'ansia persistenti o a una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.