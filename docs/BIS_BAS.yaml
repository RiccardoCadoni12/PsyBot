Questionario: BIS/BAS
descrizione: >
 The BIS/BAS scales, developed by Carver and White in 1994, assess two motivational systems:
  the Behavioral Inhibition System (BIS) and the Behavioral Activation System (BAS).
  The BIS is associated with sensitivity to punishment and avoidance,
  while the BAS is related to sensitivity to reward and approach behaviors.
  The questionnaire includes 24 items divided into four subscales: BIS, BAS Drive, BAS Fun Seeking, and BAS Reward Responsiveness.
  Scores range from 7 to 28 for BIS and 13 to 52 for BAS.
cosa_misura: Sensitivity to punishment (BIS) and reward (BAS)
valore_minimo: BIS=7; BAS=13
valore_massimo: BIS=28; BAS=52
valori_di_riferimento: 
   - Higher BIS scores indicate greater sensitivity to punishment
   - Higher BAS scores indicate greater sensitivity to reward