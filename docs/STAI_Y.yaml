Questionario: STAI-Y
descrizione: >
  Lo State-Trait Anxiety Inventory - Forma Y (STAI-Y) è un questionario psicometrico sviluppato da Charles D. Spielberger 
  per valutare l'ansia in due dimensioni: ansia di stato (transitoria) e ansia di tratto (stabile). 
  Composto da 40 item (20 per ciascuna scala), è ampiamente utilizzato in ambito clinico e di ricerca. 
  La versione italiana, curata da Pedrabissi e Santinello (1989), ha dimostrato una buona affidabilità, 
  con una consistenza interna tra 0.91 e 0.95 per la scala di stato e tra 0.85 e 0.90 per la scala di tratto. 
  La stabilità test-retest è di 0.49 per la scala di stato e di 0.82 per quella di tratto.
cosa_misura: ansia (stato e tratto)
valore_minimo: 20
valore_massimo: 80
valori_di_riferimento: 
  - 20/37= ansia bassa; 
  - 38/44= ansia moderata; 
  - 45/80= ansia elevata. 
