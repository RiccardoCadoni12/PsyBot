Questionario: STAI-Y
descrizione: >
  The State-Trait Anxiety Inventory – Form Y (STAI-Y) is a psychometric questionnaire developed by Charles D. Spielberger
  to assess anxiety in two dimensions: state anxiety (temporary) and trait anxiety (stable).
  It consists of 40 items (20 for each scale) and is widely used in clinical and research settings.
  The Italian version, developed by Pedrabissi and Santinello (1989), has shown good reliability,
  with internal consistency ranging from 0.91 to 0.95 for the state scale and 0.85 to 0.90 for the trait scale.
  Test-retest stability is 0.49 for the state scale and 0.82 for the trait scale.
cosa_misura: Anxiety (state and trait)
valore_minimo: 20
valore_massimo: 80
valori_di_riferimento: 
  - 20/37= Low anxiety; 
  - 38/44= Moderate anxiety; 
  - 45/80= High anxiety. 