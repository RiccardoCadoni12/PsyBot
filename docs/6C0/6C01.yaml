disturbo: Encopresi
codice: 6C01 
gruppo_superiore: Disturbi dell'eliminazione
livello: 2
descrizione: >
    L'encopresi è la ripetuta evacuazione di feci in luoghi inappropriati. 
    L'encopresi deve essere diagnosticata se l'evacuazione inappropriata di feci si verifica ripetutamente (ad esempio, almeno una volta al mese per un periodo di diversi mesi) in un individuo che ha raggiunto l'età evolutiva in cui la continenza fecale è normalmente prevista (4 anni). 
    L'incontinenza fecale può essere presente dalla nascita (ovvero, un'estensione atipica della normale incontinenza infantile) o può essere insorta dopo un periodo di controllo intestinale acquisito. 
    L'encopresi non deve essere diagnosticata se la contaminazione fecale è interamente attribuibile a un'altra condizione di salute (ad esempio, megacolon aganglionare, spina bifida, demenza), anomalie intestinali congenite o acquisite, infezioni gastrointestinali o uso eccessivo di lassativi.
requisiti diagnostici: >
    Evacuazione ripetuta e persistente di feci in luoghi inappropriati (ad esempio, almeno una volta al mese per un periodo di diversi mesi).
    Individuo che ha raggiunto l'età evolutiva in cui normalmente ci si aspetta la continenza fecale (approssimativamente equivalente a un'età cronologica di 4 anni).
    L'inquinamento fecale non è meglio spiegato dagli effetti fisiologici di una sostanza (ad esempio, uso eccessivo di lassativi) o da un'altra condizione medica (ad esempio, megacolon aganglionare, spina bifida, stenosi anale, diarrea cronica, anomalie congenite o acquisite dell'intestino o infezione gastrointestinale).
sottocategorie:
  - Encopresi con stipsi o incontinenza da rigurgito
  - Encopresi senza stipsi o incontinenza da rigurgito