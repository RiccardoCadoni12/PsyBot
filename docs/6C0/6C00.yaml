disturbo: Enuresi
codice: 6C00 
gruppo_superiore: Disturbi dell'eliminazione
livello: 2
inclusioni:
  - Enuresi funzionale
  - Enuresi psicogena
  - Incontinenza urinaria di origine non organica
esclusioni:
  - Incontinenza urinaria da sforzo
  - Incontinenza urinaria da urgenza 
  - Incontinenza urinaria funzionale 
  - Incontinenza urinaria da rigurgito 
  - Incontinenza urinaria riflessa 
  - Incontinenza urinaria extrauretrale 
descrizione: >
    L'enuresi è la ripetuta minzione di urina nei vestiti o nel letto, che può verificarsi durante il giorno o la notte, in un individuo che ha raggiunto un'età evolutiva in cui la continenza urinaria è normalmente prevista (5 anni). 
    L'incontinenza urinaria può essere presente dalla nascita (ovvero, un'estensione atipica della normale incontinenza infantile), oppure può essere insorta dopo un periodo di acquisito controllo della vescica. 
    Nella maggior parte dei casi, il comportamento è involontario, ma in alcuni casi sembra intenzionale. 
    L'enuresi non deve essere diagnosticata se la minzione involontaria di urina è dovuta a una condizione di salute che interferisce con la continenza (ad esempio, malattie del sistema nervoso o disturbi muscoloscheletrici) o ad anomalie congenite o acquisite del tratto urinario.
requisiti diagnostici: >
    Emissione ripetuta e persistente di urina nel letto o nei vestiti (ad esempio, diverse volte alla settimana per diversi mesi), che può verificarsi durante il giorno o la notte.
    L'individuo ha raggiunto un'età evolutiva in cui normalmente ci si aspetta la continenza urinaria (approssimativamente equivalente a un'età cronologica di 5 anni).
    I sintomi non sono meglio spiegati dagli effetti fisiologici di una sostanza o di un farmaco o da un'altra condizione medica (ad esempio, una malattia del sistema nervoso, una malattia del sistema muscoloscheletrico o del tessuto connettivo, oppure anomalie congenite o acquisite del tratto urinario).
sottocategorie:
  - Enuresi notturna
  - Enuresi diurna
  - Enuresi notturna e diurna