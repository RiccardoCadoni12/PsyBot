Questionario: MEQ
descrizione: >
  The Morningness-Eveningness Questionnaire (MEQ), developed by Horne and Ostberg in 1976,
  is a self-assessment tool consisting of 19 questions designed to determine an individual's circadian preference,
  classifying them as "morning type", "intermediate type", or "evening type".
  The total score ranges from 16 to 86.
  Studies have shown that morning types tend to have an earlier circadian peak compared to evening types.
      
cosa_misura: Chronotype (circadian preference)
valore_minimo: 16
valore_massimo: 86
valori_di_riferimento: 
 - 16/30= Definite evening type; 
 - 31/41= Moderate evening type; 
 - 42/58= Intermediate type; 
 - 59/69= Moderate morning type; 
 - 70/86= Definite morning type. 