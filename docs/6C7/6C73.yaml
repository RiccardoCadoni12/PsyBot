disturbo: Disordine esplosivo intermittente 
codice: 6C73
gruppo_superiore: Disturbi del controllo degli impulsi
livello: 2
esclusioni: Disturbo oppositivo ribelle
descrizione: >
    Il disturbo esplosivo intermittente è caratterizzato da ripetuti brevi episodi di aggressione verbale o fisica o di distruzione di proprietà che rappresentano un'incapacità di controllare gli impulsi aggressivi, con l'intensità dello sfogo o il grado di aggressività palesemente sproporzionati rispetto alla provocazione o agli stressori psicosociali scatenanti. 
    I sintomi non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo e non fanno parte di un quadro di rabbia e irritabilità croniche (ad es., nel disturbo oppositivo provocatorio). 
    Il quadro comportamentale è di gravità sufficiente a causare una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Un quadro di episodi ricorrenti, brevi ed esplosivi che comportano aggressività verbale (ad esempio, attacchi verbali a un'altra persona, scoppi d'ira, urla) o aggressione fisica in un individuo di almeno 6 anni di età, quando si prevede che l'inibizione degli scoppi d'ira sia stata raggiunta, o un livello di sviluppo equivalente. 
    Gli episodi di aggressione fisica possono provocare danni significativi o la distruzione di proprietà o aggressioni fisiche con lesioni personali; tuttavia, tali esiti non sono necessari per la diagnosi.
    L'intensità degli scoppi d'ira o il grado di aggressività sono palesemente sproporzionati rispetto alla provocazione o all'evento o alla situazione scatenante.
    Gli episodi esplosivi devono verificarsi regolarmente per un periodo di tempo prolungato (ad esempio, almeno 3 mesi), in modo da rappresentare un modello persistente di comportamento aggressivo. 
    Una soglia di frequenza inferiore (ad esempio, diverse volte nel corso di un anno) può essere utilizzata per episodi di elevata intensità con gravi conseguenze negative, come l'aggressione fisica a un'altra persona, mentre una soglia di frequenza più elevata (ad esempio, due o più volte a settimana) dovrebbe essere utilizzata per episodi caratterizzati da aggressione verbale o aggressione fisica non aggressiva e non distruttiva.
    I comportamenti aggressivi sono chiaramente di natura impulsiva o reattiva e rappresentano un fallimento nel controllo dell'impulso aggressivo. 
    In altre parole, gli atti aggressivi non sono pianificati né strumentali al raggiungimento del risultato desiderato.
    La frequenza e l'intensità degli episodi esplosivi sono al di fuori dei limiti di normale variazione previsti per età e livello di sviluppo.
    Gli scoppi d'ira esplosivi non sono meglio attribuibili ad un altro disturbo mentale, comportamentale o neuroevolutivo (ad esempio, disturbo dello spettro autistico, disturbo da deficit di attenzione e iperattività, disturbo oppositivo provocatorio con irritabilità-rabbia cronica, disturbo antisociale della condotta, delirium).
    Gli scoppi esplosivi non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, anfetamine), tra cui intossicazione e astinenza da sostanze, o a una malattia del sistema nervoso.
    Il modello comportamentale provoca un disagio significativo nell'individuo affetto dal disturbo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, professionale o di altri ambiti importanti.