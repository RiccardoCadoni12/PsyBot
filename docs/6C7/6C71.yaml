disturbo: Cleptomania 
codice: 6C71
gruppo_superiore: Disturbi del controllo degli impulsi
livello: 2
inclusioni: Furto patologico
esclusioni: Motivo di osservazione per sospetto disturbo mentale o comportamentale legato al furto in negozio, non confermato
descrizione: > 
    La cleptomania è caratterizzata da una ricorrente incapacità di controllare forti impulsi a rubare oggetti in assenza di un movente apparente (ad esempio, gli oggetti non vengono acquisiti per uso personale o per guadagno economico). 
    Vi è un crescente senso di tensione o eccitazione affettiva prima del furto e un senso di piacere, eccitazione, sollievo o gratificazione durante e immediatamente dopo l'atto del furto. 
    Il comportamento non è meglio spiegato da compromissione intellettiva, altro disturbo mentale e comportamentale o intossicazione da sostanze.
requisiti diagnostici: >
    Incapacità ricorrente di controllare i forti impulsi a rubare oggetti.
    Mancanza di un movente apparente per il furto di oggetti (ad esempio, gli oggetti non vengono acquisiti per uso personale o guadagno monetario).
    L'individuo sperimenta un aumento della tensione o dell'eccitazione affettiva prima di un furto o di un tentativo di furto.
    L'individuo prova piacere, eccitazione, sollievo o gratificazione durante e subito dopo l'atto del furto.
    Gli atti di furto o tentato furto non sono meglio spiegati da un disturbo dello sviluppo intellettuale, da un altro disturbo mentale (ad esempio, un episodio maniacale) o da intossicazione da sostanze.