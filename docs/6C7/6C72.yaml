disturbo: Disturbo del comportamento sessuale compulsivo 
codice: 6C72
gruppo_superiore: Disturbi del controllo degli impulsi
livello: 2
esclusioni: Disturbi parafilici
descrizione: >
    Il disturbo del comportamento sessuale compulsivo è caratterizzato da un persistente quadro di incapacità di controllare impulsi o pulsioni sessuali intensi e ripetitivi, che si traduce in comportamenti sessuali ripetitivi. 
    I sintomi possono includere attività sessuali ripetitive che diventano un punto focale della vita della persona al punto da trascurare la salute e la cura personale o altri interessi, attività e responsabilità; numerosi tentativi infruttuosi di ridurre significativamente i comportamenti sessuali ripetitivi; e comportamenti sessuali ripetitivi continuati nonostante conseguenze negative o con scarsa o nessuna soddisfazione da essi ricavati. 
    Il quadro di incapacità di controllare impulsi o pulsioni sessuali intensi e i conseguenti comportamenti sessuali ripetitivi si manifestano per un periodo di tempo prolungato (ad esempio, 6 mesi o più) e causano marcato disagio o significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Un disagio interamente correlato a giudizi morali e disapprovazione riguardo a impulsi, pulsioni o comportamenti sessuali non è sufficiente a soddisfare questo requisito.
requisiti diagnostici: >
    Un modello persistente di incapacità di controllare impulsi o pulsioni sessuali intensi e ripetitivi che si traduce in comportamenti sessuali ripetitivi, manifestati in uno o più dei seguenti sintomi:
    Avere comportamenti sessuali ripetitivi è diventato un punto focale della vita dell'individuo, al punto da trascurare la salute e la cura personale o altri interessi, attività e responsabilità.
    L'individuo ha compiuto numerosi tentativi infruttuosi di controllare o ridurre significativamente il comportamento sessuale ripetitivo.
    L'individuo continua ad avere comportamenti sessuali ripetitivi nonostante le conseguenze negative (ad esempio, conflitti coniugali dovuti a comportamenti sessuali, conseguenze finanziarie o legali, impatto negativo sulla salute).
    La persona continua ad avere comportamenti sessuali ripetitivi anche quando ne ricava poca o nessuna soddisfazione.
    Il modello di incapacità di controllare impulsi o pulsioni sessuali intensi e ripetitivi e il conseguente comportamento sessuale ripetitivo si manifestano per un periodo di tempo prolungato (ad esempio, 6 mesi o più).
    Il modello di incapacità di controllare impulsi o pulsioni sessuali intensi e ripetitivi e il conseguente comportamento sessuale ripetitivo non sono meglio spiegati da un altro disturbo mentale (ad esempio, un episodio maniacale) o da un'altra condizione medica e non sono dovuti agli effetti di una sostanza o di un farmaco.
    Il modello di comportamento sessuale ripetitivo provoca un disagio marcato o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Un disagio interamente correlato a giudizi morali e disapprovazione riguardo a impulsi, impulsi o comportamenti sessuali non è sufficiente a soddisfare questo requisito.