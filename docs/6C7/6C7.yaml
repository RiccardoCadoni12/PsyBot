disturbo: Disturbi del controllo degli impulsi
livello: 1
descrizione: > 
    I disturbi del controllo degli impulsi sono caratterizzati dalla ripetuta incapacità di resistere a un impulso, a una pulsione o a un bisogno di compiere un'azione che sia gratificante per la persona, almeno nel breve termine, nonostante le conseguenze quali danni a lungo termine per l'individuo o per gli altri, marcata sofferenza riguardo al modello comportamentale o significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    I disturbi del controllo degli impulsi coinvolgono una gamma di comportamenti specifici, tra cui appiccare incendi, rubare, comportamenti sessuali ed esplosioni di rabbia.
requisiti diagnostici: > 
    I disturbi del controllo degli impulsi sono caratterizzati dalla ripetuta incapacità di resistere a un forte impulso, pulsione o bisogno di compiere un'azione che sia gratificante per la persona, almeno nel breve termine, nonostante un danno a lungo termine per l'individuo o per gli altri, un marcato disagio riguardo al modello comportamentale o una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    I disturbi del controllo degli impulsi coinvolgono una gamma di comportamenti specifici, tra cui appiccare incendi, rubare, comportamenti sessuali ed esplosioni di aggressività esplosiva.
    Gli episodi comportamentali associati ai Disturbi del Controllo degli Impulsi sono spesso preceduti da un aumento della tensione o dell'eccitazione affettiva, che può verificarsi anche nel tentativo di resistere al comportamento. 
    Gli episodi comportamentali sono in genere seguiti da piacere, gratificazione o sollievo dalla tensione a seguito del comportamento. 
    Tuttavia, nel corso del disturbo, gli individui possono riferire una minore consapevolezza dell'aumento della tensione o dell'eccitazione prima del comportamento o una riduzione del piacere o della gratificazione a seguito del comportamento. 
    Possono anche provare sensi di colpa o vergogna a seguito del comportamento. 
    I comportamenti associati ai Disturbi del Controllo degli Impulsi non sono completamente attribuibili a un altro disturbo mentale, agli effetti diretti sul sistema nervoso centrale di un farmaco o di una sostanza, tra cui intossicazione e astinenza da sostanze, o a un'altra condizione medica non classificata tra i Disturbi Mentali, Comportamentali o del Neurosviluppo.
sottocategorie: 
  - Piromania
  - Cleptomania
  - Disturbo del comportamento sessuale compulsivo
  - Disturbo esplosivo intermittente
