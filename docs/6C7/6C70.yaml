disturbo: Piromania
codice: 6C70
gruppo_superiore: Disturbi del controllo degli impulsi
livello: 2
inclusioni: Incendi patologici
esclusioni: 
  - Disturbo della condotta dissociale 
  - Disturbo bipolare di tipo I 
  - Schizofrenia o altri disturbi psicotici primari 
  - Motivo di osservazione per sospetto disturbo mentale o comportamentale legato all’incendio doloso, non confermato
descrizione: >
    La piromania è caratterizzata da una ricorrente incapacità di controllare i forti impulsi ad appiccare incendi, che si traduce in molteplici atti o tentativi di appiccare incendi a proprietà o altri oggetti, in assenza di un movente apparente (ad esempio, guadagno monetario, vendetta, sabotaggio, dichiarazione politica, attirare attenzione o riconoscimento). 
    Vi è un crescente senso di tensione o eccitazione affettiva prima degli episodi di appicco di incendi, un fascino o una preoccupazione persistente per il fuoco e gli stimoli correlati (ad esempio, guardare incendi, accendere incendi, fascino per le attrezzature antincendio) e un senso di piacere, eccitazione, sollievo o gratificazione durante e immediatamente dopo l'atto di appiccare l'incendio, assistendo ai suoi effetti o partecipando alle sue conseguenze. 
    Il comportamento non è meglio spiegato da compromissione intellettiva, altro disturbo mentale e comportamentale o intossicazione da sostanze.
requisiti diagnostici: > 
    Ricorrente incapacità di controllare i forti impulsi ad appiccare incendi, con conseguenti molteplici atti o tentativi di appiccare incendi a proprietà o altri oggetti.
    Mancanza di un movente apparente per gli atti o i tentativi di appiccare l'incendio (ad esempio, guadagno monetario, vendetta, sabotaggio, dichiarazione politica, attrazione di riconoscimenti).
    Affascinazione o preoccupazione persistente per il fuoco e gli stimoli correlati (ad esempio, osservare incendi, accendere incendi, affascinato dalle attrezzature antincendio).
    L'individuo sperimenta una maggiore tensione o eccitazione affettiva prima dei casi o dei tentativi di appiccare il fuoco.
    L'individuo prova piacere, eccitazione, sollievo o gratificazione durante e subito dopo l'atto di appiccare l'incendio, assistendone agli effetti o partecipando alle sue conseguenze.
    Gli atti o i tentativi di appiccare incendi non sono meglio spiegati da un Disturbo dello Sviluppo Intellettuale, da un altro disturbo mentale (ad esempio un Episodio Maniacale) o da un'Intossicazione da Sostanze.