disturbo: Disturbo pedofilico 
codice: 6D32
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo pedofilico è caratterizzato da un modello di eccitazione sessuale persistente, mirato e intenso manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti che coinvolge bambini in età prepuberale. 
    Inoltre, affinché il disturbo pedofilico possa essere diagnosticato, l'individuo deve aver agito in base a questi pensieri, fantasie o impulsi o esserne marcatamente turbato. 
    Questa diagnosi non si applica ai comportamenti sessuali tra bambini in età prepuberale o postpuberale con coetanei di età simile.
requisiti diagnostici: >
    Un modello di eccitazione sessuale sostenuto, concentrato e intenso, manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti, che coinvolge i bambini in età prepuberale.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.
    La diagnosi non si applica all'eccitazione sessuale e al comportamento associato tra bambini pre o post puberali di età simile.