disturbo: Disturbo frotteuristico 
codice: 6D34
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo frotteuristico è caratterizzato da un modello di eccitazione sessuale sostenuto, concentrato e intenso manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti che consiste nel toccare o strofinarsi contro una persona non consenziente in luoghi pubblici affollati. 
    Inoltre, affinché il disturbo frotteuristico possa essere diagnosticato, l'individuo deve aver agito in base a questi pensieri, fantasie o impulsi o esserne marcatamente turbato. 
    Il disturbo frotteuristico esclude specificamente il toccare o lo strofinamento consensuale che si verifica con il consenso della persona o delle persone coinvolte.
requisiti diagnostici: >
    Un modello di eccitazione sessuale intenso, mirato e sostenuto, manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti, che comporta il toccare o strofinarsi contro una persona non consenziente.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.