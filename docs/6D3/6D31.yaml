disturbo: Disturbo voyeuristico
codice: 6D31
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo voyeuristico è caratterizzato da un modello di eccitazione sessuale prolungato, concentrato e intenso manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti che consiste nell'osservare un individuo ignaro nudo, in procinto di spogliarsi o impegnato in attività sessuali. 
    Inoltre, affinché il disturbo voyeuristico possa essere diagnosticato, l'individuo deve aver agito in base a questi pensieri, fantasie o impulsi o esserne marcatamente turbato. 
    Il disturbo voyeuristico esclude specificamente i comportamenti voyeuristici consensuali che si verificano con il consenso della persona o delle persone osservate.
requisiti diagnostici: >
    Un modello di eccitazione sessuale sostenuto, concentrato e intenso, manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti, che implica stimoli come l'osservazione di una persona ignara nuda, in procinto di spogliarsi o impegnata in attività sessuali.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.