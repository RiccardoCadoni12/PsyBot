disturbo: Disturbo esibizionistico 
codice: 6D30
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo esibizionistico è caratterizzato da un modello di eccitazione sessuale sostenuto, concentrato e intenso manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti che comporta l'esposizione dei propri genitali a un individuo ignaro in luoghi pubblici, solitamente senza invitare o volere un contatto più ravvicinato. 
    Inoltre, affinché il disturbo esibizionistico venga diagnosticato, l'individuo deve aver agito in base a questi pensieri, fantasie o impulsi o esserne marcatamente turbato. 
    Il disturbo esibizionistico esclude specificamente i comportamenti esibizionistici consensuali che si verificano con il consenso della persona o delle persone coinvolte, nonché le forme di esibizionismo socialmente sanzionate.
requisiti diagnostici: >
    Un modello di eccitazione sessuale intenso, mirato e sostenuto, manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti, che comporta l'esposizione dei propri genitali a una persona ignara in luoghi pubblici, solitamente senza invitare o avere l'intenzione di un contatto più ravvicinato.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.