disturbo: Disturbo da sadismo sessuale coercitivo 
codice: 6D33
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo da sadismo sessuale coercitivo è caratterizzato da un modello di eccitazione sessuale prolungato, concentrato e intenso manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti che comporta l'inflizione di sofferenza fisica o psicologica a una persona non consenziente. 
    Inoltre, affinché venga diagnosticato il disturbo da sadismo sessuale coercitivo, l'individuo deve aver agito in base a tali pensieri, fantasie o impulsi o esserne marcatamente angosciato. 
    Il disturbo da sadismo sessuale coercitivo esclude specificamente il sadismo e il masochismo sessuali consensuali.
requisiti diagnostici: >
    Un modello di eccitazione sessuale sostenuto, concentrato e intenso, manifestato da pensieri, fantasie, impulsi o comportamenti sessuali persistenti, che implica l'inflizione di sofferenza fisica o psicologica a una persona non consenziente.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.