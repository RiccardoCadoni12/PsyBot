disturbo: Disturbo parafilico che coinvolge comportamenti solitari o individui consenzienti 
codice: 6D36
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Il disturbo parafilico che coinvolge comportamenti solitari o individui consenzienti è caratterizzato da un modello persistente e intenso di eccitazione sessuale atipica manifestata da pensieri, fantasie, impulsi o comportamenti sessuali che coinvolge adulti consenzienti o comportamenti solitari. 
    Deve essere presente uno dei due elementi seguenti: 
    1) la persona è marcatamente angosciata dalla natura del modello di eccitazione e il disagio non è semplicemente una conseguenza del rifiuto o del temuto rifiuto del modello di eccitazione da parte di altri; 
    oppure 2) la natura del comportamento parafilico comporta un rischio significativo di lesioni o morte per l'individuo o per il partner (ad esempio, asfissofilia).
requisiti diagnostici: >
    Un modello sostenuto, concentrato e intenso di eccitazione sessuale atipica, che si manifesta attraverso pensieri, fantasie, impulsi o comportamenti sessuali che coinvolgono adulti consenzienti o comportamenti solitari.
    Deve essere presente uno dei due elementi seguenti:
    L'individuo è notevolmente angosciato dalla natura del modello di eccitazione e l'angoscia non è semplicemente una conseguenza del rifiuto o del temuto rifiuto del modello di eccitazione da parte di altri; 
    La natura del comportamento parafilico comporta un rischio significativo di lesioni o morte sia per l'individuo (ad esempio, asfissofilia o raggiungimento dell'eccitazione sessuale attraverso la restrizione della respirazione) sia per il partner dell'individuo (ad esempio, sadismo consensuale che provoca lesioni che richiedono attenzione medica).
    Se la diagnosi viene formulata sulla base di un rischio significativo di lesioni o morte, tale rischio dovrebbe essere direttamente e immediatamente collegato al comportamento parafilico. 
    Ad esempio, un presunto rischio di aumentata esposizione a infezioni sessualmente trasmissibili non è una base sufficiente per formulare questa diagnosi.