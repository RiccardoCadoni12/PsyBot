disturbo: Altro disturbo parafilico che coinvolge individui non consenzienti 
codice: 6D35
gruppo_superiore: Disturbi parafilici
livello: 2
descrizione: >
    Un altro disturbo parafilico che coinvolge individui non consenzienti è caratterizzato da un modello persistente e intenso di eccitazione sessuale atipica manifestata da pensieri, fantasie, impulsi o comportamenti sessuali in cui il focus del modello di eccitazione coinvolge altri che non sono disposti o non sono in grado di dare il consenso, ma che non è specificamente descritto in nessuna delle altre categorie di disturbi parafilici (ad esempio, modelli di eccitazione che coinvolgono cadaveri o animali). 
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi o esserne marcatamente angosciato. 
    Il disturbo esclude specificamente i comportamenti sessuali che si verificano con il consenso della persona o delle persone coinvolte, a condizione che siano considerate in grado di fornire tale consenso.
requisiti diagnostici: >
    Un modello sostenuto, concentrato e intenso di eccitazione sessuale atipica, manifestata da pensieri, fantasie, impulsi o comportamenti sessuali, in cui il focus del modello di eccitazione coinvolge altri che non sono disposti o non sono in grado di acconsentire e che non è descritto specificamente in nessuna delle altre categorie di disturbi parafilici (ad esempio, modelli di eccitazione che coinvolgono cadaveri o animali).
    La presentazione non soddisfa i requisiti diagnostici del disturbo da sadismo sessuale coercitivo, del disturbo pedofilico, del disturbo voyeuristico, del disturbo esibizionistico o del disturbo frotteuristico.
    L'individuo deve aver agito in base a questi pensieri, fantasie o impulsi oppure esserne rimasto notevolmente angosciato.