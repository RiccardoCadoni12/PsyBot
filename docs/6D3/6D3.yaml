disturbo: Disturbi parafilici
livello: 1
inclusioni: Parafilia
descrizione: >
    I disturbi parafilici sono caratterizzati da modelli persistenti e intensi di eccitazione sessuale atipica, manifestati da pensieri, fantasie, impulsi o comportamenti sessuali, il cui focus coinvolge altri la cui età o condizione li rende riluttanti o incapaci di acconsentire e nei confronti dei quali la persona ha agito o per i quali è notevolmente angosciata. 
    I disturbi parafilici possono includere modelli di eccitazione che coinvolgono comportamenti solitari o individui consenzienti solo quando questi sono associati a un disagio marcato che non è semplicemente il risultato del rifiuto o del temuto rifiuto del modello di eccitazione da parte di altri o con un rischio significativo di lesioni o morte.
requisiti diagnostici: >
    I disturbi parafilici sono caratterizzati da modelli persistenti e intensi di eccitazione sessuale atipica, manifestati da pensieri, fantasie, impulsi o comportamenti sessuali, in cui il focus del modello di eccitazione coinvolge altri la cui età o condizione li rende riluttanti o incapaci di acconsentire (ad esempio, bambini in età prepuberale, un individuo ignaro visto attraverso una finestra, un animale). 
    I disturbi parafilici possono anche coinvolgere altri modelli di eccitazione sessuale atipica se causano notevole disagio all'individuo o comportano un rischio significativo di lesioni o morte.
sottocategorie:
  - Disturbo esibizionistico
  - Disturbo voyeuristico
  - Disturbo pedofilico
  - Disturbo da sadismo sessuale coercitivo
  - Disturbo frotteuristico
  - Altro disturbo parafilico che coinvolge individui non consenzienti
  - Disturbo parafilico che coinvolge comportamento solitario o individui consenzienti