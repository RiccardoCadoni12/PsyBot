disturbo: Comportamenti dirompenti o disturbi dissociali
livello: 1
descrizione: >
    I disturbi comportamentali dirompenti e dissociali sono caratterizzati da problemi comportamentali persistenti che vanno da comportamenti marcatamente e persistentemente provocatori, disobbedienti, provocatori o dispettosi (ovvero, dirompenti) a quelli che violano persistentemente i diritti fondamentali degli altri o le principali norme, regole o leggi sociali appropriate all'età (ovvero, dissociali). 
    L'esordio dei disturbi comportamentali dirompenti e dissociali avviene comunemente, sebbene non sempre, durante l'infanzia.
requisiti diagnostici: >
    I disturbi da comportamento dirompente o dissociali sono caratterizzati da problemi comportamentali persistenti in molteplici contesti, con esordio comune, anche se non esclusivo, durante l'infanzia. 
    Quando presenti, questi problemi spesso persistono fino all'età adulta. 
    Questi disturbi sono caratterizzati da comportamenti che vanno da quelli descritti come dirompenti ovvero marcatamente e persistentemente provocatori, disobbedienti, provocatori o dispettosi a comportamenti considerati dissociali perché violano persistentemente i diritti fondamentali degli altri o le principali norme, regole o leggi sociali appropriate all'età.
    La maggior parte degli individui commette atti isolati di aggressione o violazione delle regole in un determinato momento della propria vita, e questo non giustifica la diagnosi di un Disturbo da Comportamento Dirompente o di un Disturbo Antisociale. 
    In ogni caso, i comportamenti caratteristici dei disturbi di questo gruppo devono chiaramente discostarsi dalla norma per l'età e il genere dell'individuo, dato il suo contesto socio-culturale.
    I Disturbi da Comportamento Dirompente o Disturbi Dissociali possono coesistere con altri Disturbi Mentali, Comportamentali o del Neurosviluppo. 
    Tuttavia, una diagnosi separata di Disturbo da Comportamento Dirompente o Disturbo Dissociale non è giustificata se il comportamento dirompente è limitato a episodi sintomatici di un altro disturbo mentale (ad esempio, comportamento provocatorio e non collaborativo durante un Episodio Depressivo), o se il comportamento è dovuto agli effetti di una sostanza o a un'altra condizione medica.
    I disturbi da comportamento dirompente o dissociali sono spesso associati a contesti psicosociali che includono disfunzioni familiari, problemi con i coetanei, i colleghi e i partner sentimentali; e insuccessi scolastici o lavorativi. 
    Altri fattori di rischio psicosociali sono comuni, come il rifiuto da parte dei coetanei, l'influenza di gruppi di pari devianti e il disturbo mentale dei genitori. 
    Comportamenti adattivi in base alle circostanze ambientali dell'individuo (ad esempio, la fuga da una famiglia violenta; il furto per sopravvivere) non dovrebbero essere utilizzati come unica base per queste diagnosi.
sottocategorie:
  - Disturbo oppositivo provocatorio
  - Disturbo della condotta dissociale