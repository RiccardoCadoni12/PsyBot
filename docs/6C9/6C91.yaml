disturbo: Disturbo della condotta dissociale 
codice: 6C91
gruppo_superiore: Comportamenti dirompenti o disturbi dissociali
livello: 2
descrizione: >
    Il disturbo della condotta dissociale è caratterizzato da un modello di comportamento ripetitivo e persistente in cui vengono violati i diritti fondamentali degli altri o le principali norme, regole o leggi sociali appropriate all'età, come l'aggressione verso persone o animali; la distruzione di proprietà; l'inganno o il furto; e gravi violazioni di regole. 
    Il modello di comportamento è di gravità sufficiente a causare una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Per essere diagnosticato, il modello di comportamento deve essere persistente per un periodo di tempo significativo (ad esempio, 12 mesi o più). 
    Atti dissociali o criminali isolati non sono quindi di per sé motivo di diagnosi.
requisiti diagnostici: >
    Un modello comportamentale ripetitivo e persistente in cui vengono violati i diritti fondamentali degli altri o le principali norme, regole o leggi sociali o culturali appropriate all'età. 
    In genere, sono coinvolti molteplici comportamenti, tra cui uno o più dei seguenti:
    Aggressione verso persone o animali , come bullismo, minacce o intimidazioni verso altri, istigazione a scontri fisici, uso di armi che possono causare gravi danni fisici ad altri (come mattoni, bottiglie rotte, coltelli o pistole), crudeltà fisica verso le persone, crudeltà fisica verso gli animali, forme aggressive di furto (ad esempio aggressioni, scippi, estorsioni) o costrizione di qualcuno ad attività sessuali.
    Distruzione di proprietà , come l'accensione deliberata di incendi con l'intenzione di causare gravi danni o la distruzione deliberata della proprietà altrui (ad esempio, rompendo intenzionalmente i giocattoli degli altri bambini, rompendo finestre, graffiando automobili, tagliando pneumatici).
    Inganno o furto , come il furto di oggetti di valore (ad esempio, taccheggio, falsificazione), la menzogna per ottenere beni o favori o per evitare obblighi (ad esempio, "truffare" gli altri) o l'irruzione nella casa, nell'edificio o nell'auto di qualcuno.
    Gravi violazioni delle regole , come bambini o adolescenti che restano ripetutamente fuori tutta la notte nonostante i divieti dei genitori, che scappano ripetutamente di casa o che marinano spesso la scuola o il lavoro senza permesso.
    Il modello comportamentale deve essere persistente e ricorrente, includendo molteplici episodi dei tipi di comportamento sopra descritti per un periodo di tempo prolungato (ad esempio, almeno 1 anno). 
    La semplice commissione di uno o più atti delinquenziali non è sufficiente per la diagnosi.
    Il modello comportamentale determina un significativo deterioramento del funzionamento personale, familiare, sociale, educativo, occupazionale o di altri ambiti importanti.
sottocategorie:
  - Disturbo della condotta dissociale, esordio nell'infanzia
  - Disturbo della condotta dissociale, esordio nell'adolescenza