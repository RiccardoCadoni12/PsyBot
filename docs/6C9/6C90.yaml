disturbo: Disturbo oppositivo provocatorio 
codice: 6C90
gruppo_superiore: Comportamenti dirompenti o disturbi dissociali
livello: 2
descrizione: >
    Il disturbo oppositivo provocatorio è un modello persistente (ad es., 6 mesi o più) di comportamento marcatamente provocatorio, disobbediente, provocatorio o dispettoso che si verifica più frequentemente di quanto si osservi tipicamente in individui di età e livello di sviluppo comparabili e che non è limitato all'interazione con i fratelli. 
    Il disturbo oppositivo provocatorio può manifestarsi con umore prevalente e persistente di rabbia o irritabilità, spesso accompagnato da gravi scoppi d'ira o da un comportamento ostinato, polemico e provocatorio. 
    Il modello comportamentale è di gravità sufficiente a causare una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Un modello di comportamento marcatamente non conforme, provocatorio e disobbediente, atipico per individui di età, livello di sviluppo, genere e contesto socioculturale comparabili. 
    Il modello di comportamento può includere:
    Difficoltà persistenti ad andare d'accordo con gli altri (ad esempio, discutere con figure autoritarie, sfidare attivamente o rifiutarsi di rispettare richieste, direttive o regole, infastidire deliberatamente gli altri, incolpare i coetanei o i colleghi per errori o cattiva condotta).
    Comportamenti provocatori, dispettosi o vendicativi (ad esempio, antagonizzare gli altri; usare i social media per attaccare o deridere gli altri).
    Irritabilità o rabbia estreme (ad esempio, essere suscettibili o facilmente irritabili, perdere la pazienza, scoppi d'ira, essere arrabbiati e risentiti).
    Il modello comportamentale persiste per un periodo di tempo prolungato (ad esempio, 6 mesi o più).
    I comportamenti oppositivi non sono meglio spiegati da problemi relazionali tra l'individuo e una particolare figura autoritaria nei confronti della quale l'individuo si comporta in modo provocatorio. 
    Esempi possono essere genitori, insegnanti o supervisori che agiscono in modo antagonistico o pongono richieste irragionevoli all'individuo.
    Il modello comportamentale determina un significativo deterioramento del funzionamento personale, familiare, sociale, educativo o di altri ambiti importanti.
sottocategorie: 
  - Disturbo oppositivo provocatorio con irritabilità-rabbia cronica
  - Disturbo oppositivo provocatorio senza irritabilità-rabbia cronica 