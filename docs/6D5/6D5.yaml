disturbo: Disturbi fittizi
livello: 1
esclusioni: Simulazione
descrizione: >
    I disturbi fittizi sono caratterizzati dalla simulazione, falsificazione, induzione o aggravamento intenzionale di segni e sintomi medici, psicologici o comportamentali o lesioni in sé stessi o in un'altra persona, più comunemente un bambino a carico, associati a un inganno identificato. 
    Un disturbo o una malattia preesistente può essere presente, ma l'individuo aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi. 
    Gli individui con disturbo fittizio cercano un trattamento o altrimenti presentano se stessi o un'altra persona come malati, feriti o compromessi sulla base dei segni, sintomi o lesioni simulati, falsificati o autoindotti. 
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere indennità di invalidità o eludere un procedimento penale). 
    Questo è in contrasto con la Simulazione, in cui evidenti ricompense o incentivi esterni motivano il comportamento.
requisiti diagnostici: >
    I disturbi fittizi sono caratterizzati dalla simulazione, falsificazione o induzione o aggravamento intenzionale di segni e sintomi medici, psicologici o comportamentali o lesioni in sé stessi o in un'altra persona associati a un inganno identificato. 
    Un disturbo o una malattia preesistente può essere presente, ma l'individuo aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi. 
    Gli individui con Disturbi Fittizi cercano un trattamento o altrimenti presentano se stessi o un'altra persona come malati, feriti o compromessi sulla base dei segni, sintomi o lesioni simulati, falsificati o autoindotti. 
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere indennità di invalidità o eludere un procedimento penale). 
    Questo è in contrasto con la Simulazione, in cui chiare ricompense o incentivi esterni motivano il comportamento.
sottocategorie:
  - Disordine fittizio imposto a se stessi
  - Disordine fittizio imposto a un altro