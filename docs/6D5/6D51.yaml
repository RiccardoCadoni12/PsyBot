disturbo: Disordine fittizio imposto ad un altro 
codice: 6D51
gruppo_superiore: Disturbi fittizi
livello: 2
esclusioni: Simulazione
descrizione: >
    Il disturbo fittizio imposto a terzi è caratterizzato dalla simulazione, falsificazione o induzione di segni e sintomi medici, psicologici o comportamentali o lesioni in un'altra persona, più comunemente un minore a carico, associati a un inganno identificato. 
    Se nell'altra persona è presente un disturbo o una malattia preesistente, l'individuo aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi. 
    L'individuo cerca un trattamento per l'altra persona o la presenta in altro modo come malata, ferita o compromessa sulla base dei segni, sintomi o lesioni simulati, falsificati o indotti. 
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere un sussidio di invalidità o evitare un procedimento penale per abuso su minori o anziani).
requisiti diagnostici: >
    Simulazione, falsificazione o induzione intenzionale di segni e sintomi medici, psicologici o comportamentali o lesioni in un'altra persona, più comunemente un minore a carico, associata a un inganno identificato. 
    Se nell'altra persona è presente un disturbo o una malattia preesistente, l'individuo esagera o aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi.
    L'individuo cerca una cura per l'altra persona o la presenta come malata, ferita o menomata sulla base di segni, sintomi o lesioni simulati, falsificati o indotti.
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere un sussidio di invalidità o evitare un procedimento penale per abusi su minori o anziani).
    Il comportamento non è meglio spiegabile con un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario).