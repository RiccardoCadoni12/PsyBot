disturbo: Disordine fittizio imposto a se stessi 
codice: 6D50
gruppo_superiore: Disturbi fittizi
livello: 2
inclusioni: Sindrome di Münchhausen
esclusioni:
  - Disturbo da escoriazione
  - Simulazione
descrizione: >
    Il disturbo fittizio autoimposto è caratterizzato dalla simulazione, falsificazione o induzione di segni e sintomi medici, psicologici o comportamentali o di lesioni associati a un inganno identificato. 
    In presenza di un disturbo o di una malattia preesistente, l'individuo aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi. 
    L'individuo cerca un trattamento o si presenta in altro modo come malato, ferito o menomato sulla base dei segni, sintomi o lesioni simulati, falsificati o autoindotti. 
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere un sussidio di invalidità o eludere un procedimento penale). 
    Questo è in contrasto con la Simulazione, in cui evidenti ricompense o incentivi esterni motivano il comportamento.
requisiti diagnostici: >
    Simulazione, falsificazione o induzione intenzionale di segni e sintomi medici, psicologici o comportamentali o lesioni associati a un inganno identificato. 
    In presenza di un disturbo o di una malattia preesistente, l'individuo aggrava intenzionalmente i sintomi esistenti o falsifica o induce sintomi aggiuntivi.
    L'individuo cerca cure o si presenta come malato, ferito o menomato sulla base di segni, sintomi o lesioni simulati, falsificati o autoindotti.
    Il comportamento ingannevole non è motivato esclusivamente da evidenti ricompense o incentivi esterni (ad esempio, ottenere un sussidio di invalidità o eludere un procedimento penale).
    Il comportamento non è meglio spiegabile con un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario).