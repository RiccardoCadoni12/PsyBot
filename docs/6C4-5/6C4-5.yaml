disturbo: Disturbi dovuti all'uso di sostanze o a comportamenti di dipendenza
livello: 1
descrizione: >
    I disturbi dovuti all'uso di sostanze e ai comportamenti di dipendenza sono disturbi mentali e comportamentali che si sviluppano a seguito dell'uso di sostanze prevalentemente psicoattive, compresi i farmaci, o di specifici comportamenti ripetitivi gratificanti e rinforzanti.
sottocategorie:
  - Disturbi dovuti all'uso di sostanze
  - Disturbi dovuti a comportamenti di dipendenza