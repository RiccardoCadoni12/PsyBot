disturbo: Disturbi dovuti a comportamenti di dipendenza
codice: 6C5
gruppo_superiore: Disturbi dovuti all'uso di sostanze o a comportamenti di dipendenza
livello: 2
esclusioni:
  - Disturbo del comportamento sessuale compulsivo 
  - Disturbi parafilici 
descrizione: >
    I disturbi dovuti a comportamenti di dipendenza sono sindromi riconoscibili e clinicamente significative associate a disagio o interferenza con le funzioni personali, che si sviluppano a seguito di comportamenti ripetitivi e gratificanti, diversi dall'uso di sostanze che creano dipendenza. 
    I disturbi dovuti a comportamenti di dipendenza includono il disturbo da gioco d'azzardo e il disturbo da gioco digitale, che possono coinvolgere sia comportamenti online che offline.
requisiti diagnostici: >
    I disturbi dovuti a comportamenti di dipendenza sono sindromi riconoscibili e clinicamente significative associate a disagio o interferenza con le funzioni personali che si sviluppano come risultato di comportamenti ripetitivi e gratificanti diversi dall'uso di sostanze che creano dipendenza o da comportamenti sessuali.
sottocategorie:
  - Disturbo da gioco d'azzardo
  - Disturbo da gioco digitale