disturbo: Disturbo dissociativo parziale dell'identità
codice: 6B65 
gruppo_superiore: Disturbi dissociativi
livello: 2
descrizione: >
    Il disturbo dissociativo parziale dell'identità è caratterizzato da una disgregazione dell'identità in cui sono presenti due o più stati di personalità distinti (identità dissociative) associati a marcate discontinuità nel senso di sé e nell'agire. 
    Ogni stato di personalità include un proprio schema di esperienza, percezione, concezione e relazione con sé stessi, il corpo e l'ambiente. 
    Uno stato di personalità è dominante e normalmente funziona nella vita quotidiana, ma è invaso da uno o più stati di personalità non dominanti (intrusioni dissociative). 
    Queste intrusioni possono essere cognitive, affettive, percettive, motorie o comportamentali. 
    Sono vissute come interferenti con il funzionamento dello stato di personalità dominante e sono tipicamente avversive. 
    Gli stati di personalità non dominanti non assumono ricorrentemente il controllo esecutivo della coscienza e del funzionamento dell'individuo, ma possono esserci episodi occasionali, limitati e transitori in cui uno stato di personalità distinto assume il controllo esecutivo per impegnarsi in comportamenti circoscritti, come in risposta a stati emotivi estremi o durante episodi di autolesionismo o la rievocazione di ricordi traumatici. 
    I sintomi non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo e non sono dovuti agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, inclusi gli effetti dell'astinenza, né sono dovuti a una malattia del sistema nervoso o a un disturbo del sonno-veglia. 
    I sintomi comportano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Disgregazione dell'identità caratterizzata dall'esperienza di due o più stati di personalità distinti (identità dissociative), che comportano discontinuità nel senso di sé e nell'agire. 
    Ogni stato di personalità include un proprio schema di esperienza, percezione, concezione e relazione con sé stessi, il corpo e l'ambiente.
    Uno stato di personalità è dominante e funzionale nella vita quotidiana (ad esempio, genitorialità, lavoro), ma è invaso da uno o più stati di personalità non dominanti (intrusioni dissociative). 
    Queste intrusioni possono essere cognitive (pensieri intrusivi), affettive (affetti intrusivi come paura, rabbia o vergogna), percettive (ad esempio, voci intruse, percezioni visive fugaci, sensazioni come essere toccati), motorie (ad esempio, movimenti involontari di un braccio) o comportamentali (ad esempio, un'azione priva di senso di azione o appartenenza). 
    Queste esperienze sono vissute come interferenti con il funzionamento dello stato di personalità dominante e sono tipicamente avversive.
    Gli stati di personalità non dominanti non assumono ricorrentemente il controllo esecutivo della coscienza e del funzionamento dell'individuo nella misura in cui agiscono in aspetti specifici della vita quotidiana (ad esempio, genitorialità, lavoro). 
    Tuttavia, possono verificarsi episodi occasionali, limitati e transitori in cui uno stato di personalità distinto assume il controllo esecutivo per intraprendere comportamenti circoscritti (ad esempio, in risposta a stati emotivi estremi o durante episodi di autolesionismo o rievocazione di ricordi traumatici).
    I sintomi non sono meglio attribuibili ad un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario).
    I sintomi non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti dell'astinenza (ad esempio, svenimenti o comportamento caotico durante l'intossicazione da sostanze) e non sono dovuti a una malattia del sistema nervoso (ad esempio, crisi parziali complesse) o a un disturbo del sonno-veglia (ad esempio, i sintomi si verificano durante stati ipnagogici o ipnopompici).
    I sintomi comportano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.