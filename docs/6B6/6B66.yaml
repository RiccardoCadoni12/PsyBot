disturbo: Disturbo di depersonalizzazione-derealizzazione
codice: 6B66 
gruppo_superiore: Disturbi dissociativi
livello: 2
descrizione: >
    Il disturbo di depersonalizzazione-derealizzazione è caratterizzato da esperienze persistenti o ricorrenti di depersonalizzazione, derealizzazione o entrambe. 
    La depersonalizzazione è caratterizzata dal percepire se stessi come estranei o irreali, o dal sentirsi distaccati, o come se si fosse un osservatore esterno, dei propri pensieri, sentimenti, sensazioni, corpo o azioni. 
    La derealizzazione è caratterizzata dal percepire altre persone, oggetti o il mondo come estranei o irreali (ad esempio, onirici, distanti, nebbiosi, senza vita, incolori o visivamente distorti) o dal sentirsi distaccati dall'ambiente circostante. 
    Durante le esperienze di depersonalizzazione o derealizzazione, l'esame di realtà rimane intatto. 
    Le esperienze di depersonalizzazione o derealizzazione non si verificano esclusivamente durante un altro disturbo dissociativo e non sono meglio spiegate da un altro disturbo mentale, comportamentale o del neurosviluppo. 
    Le esperienze di depersonalizzazione o derealizzazione non sono dovute agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, inclusi gli effetti dell'astinenza, e non sono dovute a una malattia del sistema nervoso o a un trauma cranico. 
    I sintomi provocano un disagio significativo o una compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altri ambiti importanti.
requisiti diagnostici: >
    Esperienze persistenti o ricorrenti di depersonalizzazione o derealizzazione o di entrambe:
    La depersonalizzazione è caratterizzata dal percepire se stessi come estranei o irreali, o dal sentirsi distaccati, o come se si fosse un osservatore esterno, dei propri pensieri, sentimenti, sensazioni, corpo o azioni. 
    La depersonalizzazione può assumere la forma di intorpidimento emotivo e/o fisico, la sensazione di osservarsi da lontano o di "essere in una commedia", o alterazioni percettive (ad esempio, una percezione distorta del tempo).
    La derealizzazione è caratterizzata dal fatto di percepire altre persone, oggetti o il mondo come strani o irreali (ad esempio, onirici, distanti, nebbiosi, senza vita, senza colore o visivamente distorti) o di sentirsi distaccati da ciò che li circonda.
    Durante le esperienze di depersonalizzazione o derealizzazione, l'esame di realtà rimane intatto. Le esperienze non sono associate a deliri o convinzioni di essere controllati da persone o forze esterne.
    I sintomi non sono meglio spiegabili con un altro disturbo mentale (ad esempio, disturbo da stress post-traumatico, un disturbo d'ansia o di paura, un altro disturbo dissociativo, un disturbo di personalità).
    I sintomi non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti dell'astinenza, e non sono dovuti a una malattia del sistema nervoso (ad esempio, epilessia del lobo temporale), a un trauma cranico o a un'altra condizione medica.
    I sintomi causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.