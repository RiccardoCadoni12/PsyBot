disturbo: Disturbo dissociativo dell'identità
codice: 6B64 
gruppo_superiore: Disturbi dissociativi
livello: 2
descrizione: >
    Il disturbo dissociativo dell'identità è caratterizzato da una disgregazione dell'identità in cui sono presenti due o più stati di personalità distinti (identità dissociative) associati a marcate discontinuità nel senso di sé e nell'agire. 
    Ogni stato di personalità include un proprio schema di esperienza, percezione, concezione e relazione con sé stessi, il corpo e l'ambiente. 
    Almeno due distinti stati di personalità assumono ricorrentemente il controllo esecutivo della coscienza e del funzionamento dell'individuo nell'interazione con gli altri o con l'ambiente, ad esempio nello svolgimento di specifici aspetti della vita quotidiana come la genitorialità o il lavoro, o in risposta a situazioni specifiche (ad esempio, quelle percepite come minacciose). 
    I cambiamenti nello stato di personalità sono accompagnati da alterazioni correlate nella sensazione, nella percezione, nell'affettività, nella cognizione, nella memoria, nel controllo motorio e nel comportamento. 
    Tipicamente sono presenti episodi di amnesia, che possono essere gravi. I sintomi non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo e non sono dovuti agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, inclusi gli effetti dell'astinenza, né sono dovuti a una malattia del sistema nervoso o a un disturbo del sonno-veglia. 
    I sintomi comportano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Disgregazione dell'identità caratterizzata dalla presenza di due o più stati di personalità distinti (identità dissociative), che comportano marcate discontinuità nel senso di sé e nell'agire. 
    Ogni stato di personalità include un proprio schema di esperienza, percezione, concezione e relazione con sé stessi, il corpo e l'ambiente.
    Almeno due distinti stati di personalità assumono ripetutamente il controllo esecutivo della coscienza e del funzionamento dell'individuo nell'interazione con gli altri o con l'ambiente, come nell'esecuzione di aspetti specifici della vita quotidiana (ad esempio, la genitorialità, il lavoro) o in risposta a situazioni specifiche (ad esempio, quelle percepite come minacciose).
    I cambiamenti nello stato di personalità sono accompagnati da alterazioni correlate a sensazioni, percezioni, affetti, capacità cognitive, memoria, controllo motorio e comportamento. 
    Tipicamente si verificano episodi di amnesia incompatibili con la normale dimenticanza, che possono essere gravi.
    I sintomi non sono meglio attribuibili ad un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario).
    I sintomi non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti dell'astinenza (ad esempio, svenimenti o comportamento caotico durante l'intossicazione da sostanze) e non sono dovuti a una malattia del sistema nervoso (ad esempio, crisi parziali complesse) o a un disturbo del sonno-veglia (ad esempio, i sintomi si verificano durante stati ipnagogici o ipnopompici).
    I sintomi comportano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.