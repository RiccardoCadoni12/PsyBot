disturbo: Disturbo da trance da possessione
codice: 6B63 
gruppo_superiore: Disturbi dissociativi
livello: 2
esclusioni: 
  - Schizofrenia 
  - Disturbi dovuti all'uso di altre sostanze psicoattive specificate, compresi i farmaci 
  - Disturbo psicotico acuto e transitorio 
  - Cambiamento secondario della personalità 
descrizione: >
    Il disturbo di trance da possessione è caratterizzato da stati di trance in cui si verifica una marcata alterazione dello stato di coscienza dell'individuo e il consueto senso di identità personale dell'individuo viene sostituito da un'identità esterna "possessenziale" e in cui i comportamenti o i movimenti dell'individuo vengono vissuti come controllati dall'agente possessivo. 
    Gli episodi di trance da possessione sono ricorrenti o, se la diagnosi si basa su un singolo episodio, l'episodio è durato almeno per diversi giorni. 
    Lo stato di trance da possessione è involontario e indesiderato e non è accettato come parte di una pratica collettiva, culturale o religiosa. 
    I sintomi non si verificano esclusivamente durante un altro disturbo dissociativo e non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo. 
    I sintomi non sono dovuti agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, inclusi gli effetti di astinenza, l'esaurimento, o a stati ipnagogici o ipnopompici, e non sono dovuti a una malattia del sistema nervoso o a un disturbo del sonno-veglia. 
    I sintomi provocano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altri ambiti importanti.
requisiti diagnostici: >
    Presenza di uno stato di trance in cui si verifica una marcata alterazione dello stato di coscienza dell'individuo e il suo normale senso di identità personale viene sostituito da un'identità esterna "possessenziale". 
    Lo stato di trance è caratterizzato da comportamenti o movimenti che vengono percepiti come controllati dall'agente possessivo.
    Gli episodi di trance sono attribuiti all'influenza di uno spirito, di un potere, di una divinità o di un'altra entità spirituale esterna che li possiede.
    Gli episodi di trance sono ricorrenti oppure, se la diagnosi si basa su un singolo episodio, l'episodio dura da almeno diversi giorni.
    Lo stato di trance dovuto alla possessione è involontario e indesiderato e non è accettato come parte di una pratica religiosa o culturale collettiva.
    I sintomi non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (inclusi gli effetti dell'astinenza), all'esaurimento o a stati ipnagogici o ipnopompici, e non sono dovuti a una malattia del sistema nervoso (ad esempio, crisi parziali complesse) o a un disturbo del sonno-veglia.
    I sintomi causano un disagio significativo o una compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.