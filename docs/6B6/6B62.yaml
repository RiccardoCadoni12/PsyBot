disturbo: Disturbo di trance
codice: 6B62 
gruppo_superiore: Disturbi dissociativi
livello: 2
descrizione: >
    Il disturbo di trance è caratterizzato da stati di trance in cui si verifica una marcata alterazione dello stato di coscienza dell'individuo o una perdita del consueto senso di identità personale, in cui l'individuo sperimenta un restringimento della consapevolezza dell'ambiente circostante immediato o una concentrazione insolitamente limitata e selettiva sugli stimoli ambientali e una restrizione di movimenti, posture e linguaggio alla ripetizione di un piccolo repertorio che viene sperimentato come fuori dal proprio controllo. 
    Lo stato di trance non è caratterizzato dall'esperienza di essere sostituiti da un'identità alternativa. 
    Gli episodi di trance sono ricorrenti o, se la diagnosi si basa su un singolo episodio, l'episodio è durato almeno per diversi giorni. 
    Lo stato di trance è involontario e indesiderato e non è accettato come parte di una pratica collettiva culturale o religiosa. 
    I sintomi non si verificano esclusivamente durante un altro disturbo dissociativo e non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo. 
    I sintomi non sono dovuti agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, inclusi gli effetti dell'astinenza, l'esaurimento o gli stati ipnagogici o ipnopompici, e non sono dovuti a una malattia del sistema nervoso, a un trauma cranico o a un disturbo del sonno-veglia. 
    I sintomi causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Il disturbo da trance è caratterizzato da un'alterazione marcata, ricorrente o singola e prolungata, involontaria e involontaria dello stato di coscienza di un individuo, che comporta uno stato di trance (senza possessione). 
    Il disturbo da trance comporta tipicamente la ripetizione di un piccolo repertorio di comportamenti.
    La maggior parte degli stati di trance sono brevi e transitori e sono correlati a esperienze culturali e religiose. 
    Queste esperienze non sono considerate patologiche e non si dovrebbe formulare una diagnosi in base alla loro comparsa. 
    Gli stati di trance dovrebbero essere considerati caratteristiche di un disturbo mentale solo quando sono involontari e indesiderati, non accettati come parte di una pratica culturale o religiosa collettiva e provocano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.