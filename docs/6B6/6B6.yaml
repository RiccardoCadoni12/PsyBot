disturbo: Disturbi dissociativi
livello: 1
descrizione: >
    I disturbi dissociativi sono caratterizzati da un'interruzione o discontinuità involontaria nella normale integrazione di uno o più dei seguenti elementi: identità, sensazioni, percezioni, affetti, pensieri, ricordi, controllo sui movimenti corporei o comportamento. 
    L'interruzione o discontinuità può essere completa, ma più comunemente è parziale e può variare di giorno in giorno o persino di ora in ora. 
    I sintomi dei disturbi dissociativi non sono dovuti agli effetti diretti di un farmaco o di una sostanza, inclusi gli effetti dell'astinenza, non sono meglio spiegati da un altro disturbo mentale, comportamentale o del neurosviluppo, da un disturbo del sonno-veglia, da una malattia del sistema nervoso o da un'altra condizione di salute, e non fanno parte di una pratica culturale, religiosa o spirituale accettata. 
    I sintomi dissociativi nei disturbi dissociativi sono sufficientemente gravi da causare una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    I disturbi dissociativi sono caratterizzati da un'interruzione o discontinuità involontaria nella normale integrazione di uno o più dei seguenti elementi: identità, sensazioni, percezioni, affetti, pensieri, ricordi, controllo sui movimenti corporei o comportamento. 
    L'interruzione o discontinuità può essere completa, ma più comunemente è parziale e può variare di giorno in giorno o persino di ora in ora. 
    Le esperienze che fanno parte di una pratica culturale, religiosa o spirituale accettata non devono essere considerate sintomi di disturbi dissociativi.
sottocategorie:
  - Disturbo dissociativo dei sintomi neurologici
  - Amnesia dissociativa
  - Disturbo di trance
  - Disturbo da trance da possessione
  - Disturbo dissociativo dell'identità
  - Disturbo dissociativo parziale dell'identità
  - Disturbo di depersonalizzazione-derealizzazione