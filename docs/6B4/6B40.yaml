disturbo:  Disturbo da stress post-traumatico 
codice: 6B40
gruppo_superiore: Disturbi specificamente associati allo stress
inclusioni: Nevrosi traumatica
esclusioni: 
  - Reazione acuta da stress
  - Disturbo post-traumatico da stress complesso 
livello: 2
descrizione: >
    Il disturbo post-traumatico da stress (PTSD) può svilupparsi a seguito dell'esposizione a un evento o a una serie di eventi estremamente minacciosi o orribili. 
    È caratterizzato da tutti i seguenti elementi: 
    1) rivivere l'evento o gli eventi traumatici nel presente sotto forma di vividi ricordi intrusivi, flashback o incubi. 
    La rivivenza può avvenire attraverso una o più modalità sensoriali ed è tipicamente accompagnata da emozioni forti o travolgenti, in particolare paura o orrore, e forti sensazioni fisiche; 
    2) evitamento di pensieri e ricordi dell'evento o degli eventi, o evitamento di attività, situazioni o persone che ricordano l'evento/gli eventi; 
    e 3) percezioni persistenti di una minaccia attuale elevata, ad esempio come indicato da ipervigilanza o da una maggiore reazione di sussulto a stimoli come rumori inaspettati. 
    I sintomi persistono per almeno diverse settimane e causano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Esposizione a un evento o a una situazione (di breve o lunga durata) di natura estremamente minacciosa o terrificante. 
    Tali eventi includono, a titolo esemplificativo ma non esaustivo, l'esperienza diretta di disastri naturali o provocati dall'uomo, combattimenti, incidenti gravi, torture, violenze sessuali, terrorismo, aggressioni o malattie acute potenzialmente letali (ad esempio, un infarto); l'assistere alla minaccia o all'effettiva morte di altre persone in modo improvviso, inaspettato o violento; e l'apprendere della morte improvvisa, inaspettata o violenta di una persona cara.
    A seguito dell'evento o della situazione traumatica, si sviluppa una sindrome caratteristica che dura almeno diverse settimane e che comprende tutti e tre gli elementi fondamentali:
    Rivivere l'evento traumatico nel presente, in cui l'evento/gli eventi non vengono semplicemente ricordati, ma vissuti come se si stessero verificando nuovamente nel qui e ora. 
    Questo si verifica tipicamente sotto forma di vividi ricordi o immagini intrusive; flashback, che possono variare da lievi (si ha una sensazione transitoria che l'evento si stia ripetendo nel presente) a gravi (si ha una completa perdita di consapevolezza dell'ambiente circostante), oppure sogni o incubi ripetitivi tematicamente correlati all'evento/agli eventi traumatici. 
    Il rivivere è tipicamente accompagnato da emozioni forti o travolgenti, come paura o orrore, e forti sensazioni fisiche. 
    Il rivivere nel presente può anche comportare la sensazione di essere sopraffatti o immersi nelle stesse intense emozioni vissute durante l'evento traumatico, senza un aspetto cognitivo rilevante, e può verificarsi in risposta ai ricordi dell'evento. 
    Riflettere o ruminare sull'evento/agli eventi e ricordare le emozioni provate in quel momento non sono sufficienti per soddisfare il requisito del rivivere.
    Evitamento deliberato di fattori che potrebbero indurre a rivivere l'evento/gli eventi traumatici. 
    Questo può assumere la forma di un evitamento interno attivo di pensieri e ricordi relativi all'evento/i, oppure di un evitamento esterno di persone, conversazioni, attività o situazioni che ricordano l'evento/gli eventi. 
    In casi estremi, la persona può cambiare ambiente (ad esempio, trasferirsi in un'altra città o cambiare lavoro) per evitare i fattori che la ricordano.
    Percezioni persistenti di una minaccia attuale più grave, ad esempio come indicato da ipervigilanza o da una maggiore reazione di sussulto a stimoli come rumori inaspettati. 
    Le persone ipervigilanti si proteggono costantemente dal pericolo e avvertono se stesse o gli altri a loro vicini come sotto minaccia immediata, sia in situazioni specifiche che più in generale. 
    Possono adottare nuovi comportamenti volti a garantire la sicurezza (ad esempio, non sedersi con le spalle alla porta, controllare ripetutamente gli specchietti retrovisori dei veicoli).
    Il disturbo determina una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.