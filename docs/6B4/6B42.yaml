disturbo: Disturbo da lutto prolungato
codice: 6B42 
gruppo_superiore: Disturbi specificamente associati allo stress
livello: 2
descrizione: >
    Il disturbo da lutto prolungato è un disturbo in cui, in seguito alla morte di un partner, di un genitore, di un figlio o di un'altra persona vicina al defunto, si verifica una risposta di dolore persistente e pervasiva caratterizzata da desiderio per il defunto o da una preoccupazione persistente per lui accompagnata da intenso dolore emotivo (ad esempio, tristezza, senso di colpa, rabbia, negazione, biasimo, difficoltà ad accettare la morte, sensazione di aver perso una parte di sé, incapacità di provare stati d'animo positivi, intorpidimento emotivo, difficoltà a impegnarsi in attività sociali o di altro tipo). 
    La risposta di dolore persiste per un periodo di tempo atipicamente lungo dopo la perdita (più di 6 mesi come minimo) e supera chiaramente le norme sociali, culturali o religiose attese per la cultura e il contesto dell'individuo. 
    Le reazioni di dolore che persistono per periodi più lunghi, entro un periodo normativo di lutto dato il contesto culturale e religioso della persona, sono considerate normali risposte al lutto e non vengono assegnate a una diagnosi. 
    Il disturbo causa una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Storia di lutto in seguito alla morte di un partner, di un genitore, di un figlio o di un'altra persona vicina alla persona in lutto.
    Una risposta al lutto persistente e pervasiva, caratterizzata da nostalgia per il defunto o da una preoccupazione persistente per lui, accompagnata da un intenso dolore emotivo. 
    Questo può manifestarsi con esperienze come tristezza, senso di colpa, rabbia, negazione, senso di colpa, difficoltà ad accettare la morte, sensazione di aver perso una parte di sé, incapacità di provare stati d'animo positivi, intorpidimento emotivo e difficoltà a impegnarsi in attività sociali o di altro tipo.
    La risposta al lutto pervasivo si è protratta per un periodo di tempo atipicamente lungo dopo la perdita, superando nettamente le norme sociali, culturali o religiose previste per la cultura e il contesto dell'individuo. 
    Le risposte al lutto che durano meno di 6 mesi, e per periodi più lunghi in alcuni contesti culturali, non dovrebbero essere considerate soddisfacenti questo requisito.
    Il disturbo determina una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.