disturbo: Disturbo post-traumatico da stress complesso
codice: 6B41 
gruppo_superiore: Disturbi specificamente associati allo stress
livello: 2
esclusioni:
  - Disturbo da stress post-traumatico 
  - Disturbo di personalità 
descrizione: >
    Il disturbo post-traumatico da stress complesso (DPTS complesso) è un disturbo che può svilupparsi a seguito dell'esposizione a un evento o a una serie di eventi di natura estremamente minacciosa o orribile, più comunemente eventi prolungati o ripetitivi da cui è difficile o impossibile sfuggire (ad esempio tortura, schiavitù, campagne di genocidio, violenza domestica prolungata, ripetuti abusi sessuali o fisici durante l'infanzia). 
    Sono soddisfatti tutti i requisiti diagnostici per il DPTS. 
    Inoltre, il DPTS complesso è caratterizzato da gravi e persistenti 
    1) problemi nella regolazione degli affetti; 
    2) convinzioni di sé come sminuiti, sconfitti o inutili, accompagnate da sentimenti di vergogna, colpa o fallimento correlati all'evento traumatico; 
    e 3) difficoltà nel mantenere relazioni e nel sentirsi vicini agli altri. Questi sintomi causano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Esposizione a un evento o a una serie di eventi di natura estremamente minacciosa o orribile, più comunemente eventi prolungati o ripetitivi da cui è difficile o impossibile sfuggire. 
    Tali eventi includono, a titolo esemplificativo ma non esaustivo, torture, campi di concentramento, schiavitù, campagne di genocidio e altre forme di violenza organizzata, violenza domestica prolungata e ripetuti abusi sessuali o fisici durante l'infanzia.
    A seguito dell'evento traumatico, si sviluppano tutti e tre gli elementi fondamentali del disturbo da stress post-traumatico, che durano per almeno diverse settimane:
    Rivivere l'evento traumatico dopo che si è verificato, in cui l'evento/gli eventi non vengono semplicemente ricordati, ma vissuti come se si stessero verificando di nuovo nel qui e ora. 
    Questo si verifica tipicamente sotto forma di vividi ricordi o immagini intrusive; flashback, che possono variare da lievi (si ha una sensazione transitoria che l'evento si stia ripetendo nel presente) a gravi (si ha una completa perdita di consapevolezza dell'ambiente circostante), oppure sogni o incubi ripetitivi tematicamente correlati all'evento/i traumatico/i. 
    Il rivivere è tipicamente accompagnato da emozioni forti o travolgenti, come paura o orrore, e forti sensazioni fisiche. 
    Il rivivere nel presente può anche comportare la sensazione di essere sopraffatti o immersi nelle stesse intense emozioni vissute durante l'evento traumatico, senza un aspetto cognitivo rilevante, e può verificarsi in risposta ai ricordi dell'evento. 
    Riflettere o ruminare sull'evento/gli eventi e ricordare le emozioni provate in quel momento non sono sufficienti per soddisfare il requisito del rivivere.
    Evitamento deliberato di fattori che potrebbero indurre a rivivere l'evento/gli eventi traumatici. 
    Questo può assumere la forma di un evitamento interno attivo di pensieri e ricordi relativi all'evento/i, oppure di un evitamento esterno di persone, conversazioni, attività o situazioni che ricordano l'evento/gli eventi. 
    In casi estremi, la persona può cambiare ambiente (ad esempio, traslocare o cambiare lavoro) per evitare i fattori che la ricordano.
    Percezioni persistenti di una minaccia attuale accresciuta, ad esempio come indicato da ipervigilanza o da una reazione di allarme accentuata a stimoli come rumori inaspettati. 
    Le persone ipervigilanti si proteggono costantemente dal pericolo e avvertono se stesse o gli altri a loro vicini come sotto minaccia immediata, sia in situazioni specifiche che più in generale. 
    Possono adottare nuovi comportamenti volti a garantire la sicurezza (non sedersi con le spalle alla porta, controllare ripetutamente lo specchietto retrovisore dell'auto). 
    Nel disturbo post-traumatico da stress complesso, a differenza del disturbo post-traumatico da stress, la reazione di allarme può in alcuni casi essere attenuata anziché accentuata.
    Problemi gravi e pervasivi nella regolazione degli affetti. 
    Esempi includono un'acuta reattività emotiva a fattori di stress minori, scoppi di violenza, comportamenti sconsiderati o autodistruttivi, sintomi dissociativi in situazioni di stress e intorpidimento emotivo, in particolare l'incapacità di provare piacere o emozioni positive.
    Convinzioni persistenti di sé come inferiori, sconfitti o inutili, accompagnate da profondi e pervasivi sentimenti di vergogna, colpa o fallimento correlati all'evento stressante. 
    Ad esempio, l'individuo può sentirsi in colpa per non essere riuscito a sfuggire o a soccombere alle circostanze avverse, o per non essere stato in grado di prevenire la sofferenza altrui.
    Difficoltà persistenti nel mantenere relazioni e nel sentirsi vicini agli altri. 
    La persona può costantemente evitare, deridere o avere scarso interesse per le relazioni e l'impegno sociale in generale. In alternativa, possono esserci occasionali relazioni intense, ma la persona ha difficoltà a mantenerle.
    Il disturbo determina una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.