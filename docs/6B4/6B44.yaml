disturbo:  Disturbo reattivo dell'attaccamento
codice: 6B44
gruppo_superiore: Disturbi specificamente associati allo stress
livello: 2
esclusioni:
  - Sindrome di Asperger 
  - Disturbo dell'attaccamento disinibito dell'infanzia 
descrizione: >
    Il disturbo reattivo dell'attaccamento è caratterizzato da comportamenti di attaccamento gravemente anormali nella prima infanzia, che si verificano nel contesto di una storia di cure infantili gravemente inadeguate (ad esempio, grave negligenza, maltrattamento, deprivazione istituzionale). 
    Anche quando un caregiver primario adeguato è disponibile da poco, il bambino non si rivolge a lui per conforto, supporto e nutrimento, raramente mostra comportamenti di ricerca di sicurezza nei confronti di un adulto e non reagisce quando gli viene offerto conforto. 
    Il disturbo reattivo dell'attaccamento può essere diagnosticato solo nei bambini e le sue caratteristiche si sviluppano entro i primi 5 anni di vita. 
    Tuttavia, il disturbo non può essere diagnosticato prima di 1 anno di età (o di un'età evolutiva inferiore ai 9 mesi), quando la capacità di attaccamenti selettivi potrebbe non essere completamente sviluppata, o nel contesto di un disturbo dello spettro autistico.
requisiti diagnostici: >
    Una storia di cure palesemente insufficienti che può includere:
    Persistente disprezzo per i bisogni emotivi fondamentali del bambino in termini di conforto, stimolazione e affetto.
    Persistente disprezzo per i bisogni fisici fondamentali del bambino.
    Cambiamenti ripetuti delle figure di riferimento principali (ad esempio, frequenti cambiamenti negli affidatari).
    Allevamento in contesti insoliti (ad esempio istituzioni) che impediscono la formazione di legami selettivi stabili.
    Maltrattamento.
    Comportamenti di attaccamento marcatamente anormali nei confronti degli adulti di riferimento in un bambino, caratterizzati da un modello persistente e pervasivo di comportamento inibito ed emotivamente ritirato che include entrambi i seguenti elementi:
    Minima ricerca di conforto quando si è in difficoltà.
    Risposta rara o minima al conforto quando viene offerto.
    Si presume che la cura palesemente insufficiente sia responsabile del persistente e pervasivo modello di comportamento inibito ed emotivamente ritirato.
    I sintomi sono evidenti prima dei 5 anni.
    Il bambino ha raggiunto un livello di sviluppo in cui si sviluppa normalmente la capacità di formare legami selettivi con le persone che si prendono cura di lui, il che avviene solitamente all'età cronologica di 1 anno o all'età dello sviluppo di almeno 9 mesi.
    I comportamenti di attaccamento anomali non sono meglio spiegabili con il disturbo dello spettro autistico.
    I comportamenti di attaccamento anomali non sono limitati a una specifica relazione diadica.