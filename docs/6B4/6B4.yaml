disturbo: Disturbi specificamente associati allo stress
livello: 1
esclusioni:
  - Burnout
  - Reazione acuta da stress
descrizione: >
    I disturbi specificamente associati allo stress sono direttamente correlati all'esposizione a un evento stressante o traumatico, o a una serie di tali eventi o esperienze avverse. 
    Per ciascuno dei disturbi di questo gruppo, un fattore stressante identificabile è un fattore causale necessario, sebbene non sufficiente. 
    Sebbene non tutti gli individui esposti a un fattore stressante identificato svilupperanno un disturbo, i disturbi di questo gruppo non si sarebbero verificati senza aver sperimentato l'evento stressante. 
    Gli eventi stressanti per alcuni disturbi di questo gruppo rientrano nella normale gamma di esperienze di vita (ad esempio, divorzio, problemi socio-economici, lutto). 
    Altri disturbi richiedono l'esperienza di un fattore stressante di natura estremamente minacciosa o orribile (ad esempio, eventi potenzialmente traumatici). 
    Per tutti i disturbi di questo gruppo, sono la natura, la modalità e la durata dei sintomi che insorgono in risposta agli eventi stressanti, insieme alla compromissione funzionale associata, a distinguere i disturbi.
requisiti diagnostici: >
    I disturbi specificamente associati allo stress sono direttamente correlati all'esposizione a un evento stressante o traumatico, o a una serie di tali eventi o esperienze avverse. 
    Per ciascuno dei disturbi di questo raggruppamento, un fattore stressante identificabile è un fattore causale necessario, sebbene non sufficiente. 
    La maggior parte delle persone che sperimentano fattori stressanti non sviluppa un disturbo. 
    Gli eventi stressanti per alcuni disturbi di questo raggruppamento rientrano nella normale gamma di esperienze di vita (ad esempio, divorzio, problemi socio-economici, lutto). 
    Altri disturbi richiedono l'esposizione a un fattore stressante di natura estremamente minacciosa o orribile (ad esempio, eventi potenzialmente traumatici). 
    Per tutti i disturbi di questo raggruppamento, sono la natura, il modello e la durata dei sintomi che insorgono in risposta agli eventi stressanti, insieme alla compromissione funzionale associata, a distinguere i disturbi.
sottocategorie:
  - Disturbo da stress post-traumatico
  - Disturbo post-traumatico da stress complesso
  - Disturbo da lutto prolungato
  - Disturbo dell'adattamento
  - Disturbo reattivo dell'attaccamento
  - Disturbo dell'impegno sociale disinibito