disturbo: Disturbo da impegno sociale disinibito
codice: 6B45
gruppo_superiore: Disturbi specificamente associati allo stress
livello: 2
esclusioni:
  - Sindrome di Asperger 
  - Disturbo dell'adattamento 
  - Disturbo da deficit di attenzione e iperattività 
  - Disturbo reattivo dell'attaccamento dell'infanzia 
descrizione: >
    Il disturbo da coinvolgimento sociale disinibito è caratterizzato da un comportamento sociale gravemente anomalo, che si manifesta nel contesto di una storia di cure infantili gravemente inadeguate (ad es. grave negligenza, deprivazione istituzionale). 
    Il bambino si avvicina agli adulti in modo indiscriminato, non è reticente ad avvicinarsi, si allontana con adulti sconosciuti e mostra un comportamento eccessivamente familiare nei confronti degli estranei. 
    Il disturbo da coinvolgimento sociale disinibito può essere diagnosticato solo nei bambini e le sue caratteristiche si sviluppano entro i primi 5 anni di vita. 
    Tuttavia, il disturbo non può essere diagnosticato prima di un anno di età (o di un'età evolutiva inferiore ai 9 mesi), quando la capacità di attaccamenti selettivi potrebbe non essere completamente sviluppata, o nel contesto del disturbo dello spettro autistico.
requisiti diagnostici: >
    Una storia di cure gravemente insufficienti a un bambino che può includere:
    Persistente disprezzo per i bisogni emotivi fondamentali del bambino in termini di conforto, stimolazione e affetto.
    Persistente disprezzo per i bisogni fisici fondamentali del bambino.
    Cambiamenti ripetuti delle figure di riferimento principali (ad esempio, frequenti cambiamenti negli affidatari).
    Allevamento in contesti insoliti (ad esempio istituzioni) che impediscono la formazione di legami selettivi stabili.
    Maltrattamento.
    Un modello persistente e pervasivo di comportamenti sociali marcatamente anormali in un bambino, in cui il bambino mostra una reticenza ridotta o assente nell'avvicinarsi e interagire con adulti non familiari, tra cui uno o più dei seguenti:
    Comportamento eccessivamente familiare con adulti sconosciuti, inclusa la violazione verbale o fisica dei limiti fisici e verbali socialmente appropriati (ad esempio, cercare conforto da adulti sconosciuti, porre domande inappropriate alla loro età ad adulti sconosciuti).
    Diminuzione o assenza del bisogno di consultare un adulto che si prenda cura del bambino dopo essersi allontanato, anche in contesti non familiari.
    Disponibilità ad andare con un adulto sconosciuto senza o senza alcuna esitazione.
    I sintomi sono evidenti prima dei 5 anni.
    Il bambino ha raggiunto un livello di sviluppo in cui si sviluppa normalmente la capacità di formare legami selettivi con le persone che si prendono cura di lui, il che avviene solitamente all'età cronologica di 1 anno o all'età dello sviluppo di almeno 9 mesi.
    Il comportamento disinibito nell'impegno sociale non è meglio spiegabile con un altro disturbo mentale (ad esempio, disturbo da deficit di attenzione e iperattività).
