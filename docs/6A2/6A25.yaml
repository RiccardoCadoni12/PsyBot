disturbo: Manifestanti sintomatiche dei disturbi psicotici primari 
codice: 6A25
gruppo_superiore: Schizofrenia o altri disturbi psicotici primari
livello: 2
descrizione: >
    Queste categorie possono essere utilizzate per caratterizzare l'attuale presentazione clinica in individui con diagnosi di schizofrenia o altro disturbo psicotico primario e non dovrebbero essere utilizzate in individui senza tale diagnosi. 
    Possono essere applicate più categorie. 
    I sintomi attribuibili alle conseguenze fisiopatologiche dirette di una condizione di salute o di una lesione non classificata sotto Disturbi mentali, comportamentali o dello sviluppo neurologico (ad esempio, un tumore cerebrale o una lesione cerebrale traumatica), o agli effetti diretti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti di astinenza, non devono essere considerati come esempi dei rispettivi tipi di sintomi.
requisiti diagnostici: >
    L'ICD-11 include l'opzione di fornire una specifica del livello di gravità per sei domini sintomatici per i disturbi inclusi nella schizofrenia o in altri disturbi psicotici primari. Questi domini sono:
    6A25.0 Sintomi positivi 6A25.1 Sintomi negativi 6A25.2 Sintomi di umore depressivo 6A25.3 Sintomi di umore maniacale 6A25.4 Sintomi psicomotori 6A25.5 Sintomi cognitivi
    Il contributo di ciascuno di questi domini dei sintomi può essere registrato sotto forma di specificatori, che possono essere valutati come non presenti (Nessuno), Lieve, Moderato o Grave, utilizzando i punti di ancoraggio e le descrizioni forniti nella tabella seguente. 
    Le valutazioni dovrebbero essere fatte in base alla gravità dei sintomi corrispondenti a quel dominio durante la scorsa settimana.
    Ogni dominio che contribuisce in modo significativo alla presentazione clinica individuale dovrebbe essere valutato. 
    Dovrebbero essere applicati quanti più specificatori di sintomi necessari per descrivere accuratamente l'attuale presentazione clinica. 
    Un dominio di sintomi può anche essere registrato con gravità non specificata, ad esempio se sono presenti sintomi corrispondenti a un particolare dominio ma sono disponibili informazioni insufficienti per valutarne la gravità.
    Nei casi in cui più sintomi rientrano in un particolare dominio, la valutazione dovrebbe riflettere il sintomo più grave all'interno di quel dominio. 
    Ad esempio, le allucinazioni e le deliri fanno entrambe parte del dominio dei sintomi positivi. 
    Una persona può sperimentare allucinazioni che si traducono in un minimo disagio (indicativo di sintomi positivi lievi) e deliri che influenzano il comportamento della persona ma non al punto da compromettere il suo funzionamento (indicativo di sintomi positivi moderati).
    In tal caso, i sintomi positivi della persona dovrebbero essere valutati come Moderati. 
    Si noti che le persone con disturbi psicotici primari in genere non presentano tutti i sintomi che fanno parte di un determinato dominio specificatore. 
    Ad esempio, nel dominio dei sintomi positivi, una persona può presentarsi solo con allucinazioni, solo deliri, entrambi o nessuno dei due. 
    Le descrizioni corrispondenti a ciascuna valutazione nella tabella seguente hanno lo scopo di trasmettere esempi di presentazioni di sintomi che giustificherebbero una valutazione a un particolare livello di gravità; non sono destinate ad essere utilizzate come criteri richiesti.
    Si noti che le valutazioni lieve, moderata e grave per lo specificatore dei sintomi dell'umore depressivo non sono equivalenti ai corrispondenti requisiti diagnostici per un episodio depressivo lieve, moderato o grave. 
    In altre parole, una valutazione di lieve per i sintomi dell'umore depressivo negli specificatori del disturbo psicotico non indica che l'individuo soddisfi i requisiti per un episodio depressivo lieve. 
    Lo stesso vale per lo specifico dei sintomi dell'umore manicale. La valutazione dei sintomi dell'umore depressivo e maniacale in questi specificatori indica la gravità dell'umore depresso, elevato o irritabile e non include altri sintomi (ad esempio, disturbi del sonno, anedonia, cambiamento dell'appetito) che possono verificarsi come parte degli episodi di umore.
    Le valutazioni degli specificatori dei sintomi hanno lo scopo di caratterizzare l'attuale presentazione clinica tra gli individui con diagnosi di schizofrenia o altri disturbi psicotici primari e non dovrebbero essere utilizzati in individui senza tale diagnosi. 
    I sintomi attribuibili alle conseguenze fisiopatologiche dirette di una condizione medica o di una lesione comorbida non classificati come disturbi mentali, comportamentali o dello sviluppo neurologico (ad esempio, un tumore cerebrale o una lesione cerebrale traumatica), o agli effetti fisiologici diretti di sostanze o farmaci, compresi gli effetti di astinenza, non devono essere inclusi nelle valutazioni del specificatore. 
    Tuttavia, negli individui con schizofrenia o altri disturbi psicotici primari, l'eziologia specifica dei sintomi è spesso poco chiara (ad esempio, se un sintomo dell'umore è dovuto al disturbo psicotico o al risultato dell'uso di sostanze). In questi casi, il sintomo rilevante dovrebbe essere considerato nel fare la valutazione del specificatore fino a quando non diventa chiaro che la patogenesi del sintomo non è correlata al disturbo psicotico primario.
sottocategorie: 
  - Sintomi positivi nei disturbi psicotici primari
  - Sintomi negativi nei disturbi psicotici primari
  - Sintomi dell'umore depressivo nei disturbi psicotici primari
  - Sintomi dell'umore maniaco nei disturbi psicotici primari
  - Sintomi psicomotori nei disturbi psicotici primari
  - Sintomi cognitivi nei disturbi psicotici primari