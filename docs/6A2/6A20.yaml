disturbo: Schizofrenia 
codice: 6A20
gruppo_superiore: Schizofrenia o altri disturbi psicotici primari
livello: 2
esclusioni:
  - Disturbo schizotipico 
  - Reazione schizofrenica 
  - Disturbo psicotico acuto e transitorio 
descrizione: >
    La schizofrenia è caratterizzata da disturbi in molteplici modalità mentali, tra cui il pensiero (ad esempio, deliri, disorganizzazione sotto forma di pensiero), percezione (ad esempio, allucinazioni), auto-esperienza (ad esempio, l'esperienza che i propri sentimenti, impulsi, pensieri o comportamento sono sotto il controllo di una forza esterna), cognizione (ad esempio, alterazione dell'attenzione, memoria verbale e cognizione sociale), volizione (ad esempio, perdita di motivazione), affetto (ad esempio, espressione emotiva smussata) e comportamento (ad esempio, comportamento che appare bizzarro o senza scopo, risposte emotive imprevedibili o inappropriate che interferiscono con l'organizzazione del comportamento). 
    Possono essere presenti disturbi psicomotori, tra cui catatonia. 
    Delusioni persistenti, allucinazioni persistenti, disturbi del pensiero ed esperienze di influenza, passività o controllo sono considerati sintomi principali. 
    I sintomi devono essere persistiti per almeno un mese affinché sia assegnata una diagnosi di schizofrenia. I sintomi non sono una manifestazione di un'altra condizione di salute (ad esempio, un tumore al cervello) e non sono dovuti all'effetto di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, corticosteroidi), incluso l'astinenza (ad esempio, astinenza da alcol).
requisiti diagnostici: >
    Almeno due dei seguenti sintomi devono essere presenti (dal rapporto dell'individuo o attraverso l'osservazione da parte del medico o di altri informatori) la maggior parte del tempo per un periodo di 1 mese o più. Almeno uno dei sintomi qualificanti dovrebbe essere dal punto a) al d) di seguito:
    a) Deliri persistenti (ad esempio, deliri grandiosi, delusioni di riferimento, deliri persecutori).
    b) Allucinazioni persistenti (più comunemente uditive, anche se possono essere in qualsiasi modalità sensoriale).
    c) Pensiero disorganizzato (disturbo formale del pensiero) (ad esempio, tangenzialità e associazioni sciolte, discorso irrilevante, neologismi). Quando è grave, il discorso della persona può essere così incoerente da essere incomprensibile ("insalata di parole").
    d) Esperienze di influenza, passività o controllo (cioè l'esperienza che i propri sentimenti, impulsi, azioni o pensieri non sono generati da se stessi, vengono collocati nella propria mente o ritirati dalla propria mente da altri, o che i propri pensieri vengono trasmessi agli altri).
    e) Sintomi negativi come appiattimento affettivo, alogia o scarsità di parola, avolizione, asocialità e anedonia.
    f) Comportamento grossolanamente disorganizzato che impedisce l'attività diretta agli obiettivi (ad esempio, comportamenti che appaiono bizzarri o senza scopo, risposte emotive imprevedibili o inappropriate che interferiscono con la capacità di organizzare il comportamento.)
    g) Disturbi psicomotori come irrequietezza catatonica o agitazione, postura, flessibilità cerosa, negativismo, mutismo o stupore. 
    Nota: se la sindrome completa di Catatonia è presente nel contesto della schizofrenia, dovrebbe essere assegnata anche la diagnosi di catatonia associata a un altro disturbo mentale.
    I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco (ad esempio, corticosteroidi) sul sistema nervoso centrale, compresi gli effetti di astinenza (ad esempio, dall'alcol).
sottocategorie: 
  - Schizofrenia, primo episodio
  - Schizofrenia, episodi multipli
  - Schizofrenia, continua