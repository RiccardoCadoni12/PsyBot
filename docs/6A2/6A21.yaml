disturbo: Disturbo schizofrenico 
codice: 6A21
gruppo_superiore: Schizofrenia o altri disturbi psicotici primari
livello: 2
descrizione: >
    Il disturbo schizoaffettivo è un disturbo episodico in cui i requisiti diagnostici della schizofrenia e un episodio depressivo maniacale, misto o moderato o grave sono soddisfatti all'interno dello stesso episodio di malattia, contemporaneamente o entro pochi giorni l'uno dall'altro. 
    I sintomi importanti della schizofrenia (ad esempio deliri, allucinazioni, disorganizzazione sotto forma di pensiero, esperienze di influenza, passività e controllo) sono accompagnati da sintomi tipici di un episodio depressivo moderato o grave (ad esempio umore depresso, perdita di interesse, energia ridotta), un episodio maniacale (ad esempio uno stato d'animo estremo caratterizzato da euforia, irritabilità o espansione; aumento dell'attività o un'esperienza soggettiva di maggiore energia) o un episodio misto. 
    Possono essere presenti disturbi psicomotori, tra cui catatonia. 
    I sintomi devono essere persistiti per almeno un mese. I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio un tumore al cervello) e non sono dovuti all'effetto di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio corticosteroidi), compreso l'astinenza (ad esempio l'astinenza da alcol).
requisiti diagnostici: >
    Tutti i requisiti diagnostici per la schizofrenia sono soddisfatti in concomitanza con i sintomi dell'umore che soddisfano i requisiti diagnostici di un episodio depressivo moderato o grave, un episodio manicale o un episodio misto. Nota: nel fare una diagnosi di disturbo schizoaffettivo, gli episodi depressivi devono includere l'umore depresso, non solo la diminuzione dell'interesse o del piacere.
    L'insorgenza dei sintomi psicotici e dell'umore è simultanea o si verifica entro pochi giorni l'uno dall'altro.
    La durata degli episodi sintomatici è di almeno 1 mese sia per i sintomi psicotici che per quelli dell'umore.
    I sintomi o i comportamenti non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, corticosteroidi), compresi gli effetti di astinenza (ad esempio, dall'alcol).
sottocategorie: 
  - Disturbo schizoaffettivo, primo episodio
  - Disturbo schizoaffettivo, episodi multipli
  - Disturbo schizoaffettivo, continuo