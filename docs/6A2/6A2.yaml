disturbo: Schizofrenia o altri disturbi psicotici primari
livello: 1
descrizione: >
    La schizofrenia e altri disturbi psicotici primari sono caratterizzati da menomazioni significative nei test di realtà e alterazioni del comportamento che si manifestano in sintomi positivi come deliri persistenti, allucinazioni persistenti, pensiero disorganizzato (tipicamente si manifesta come discorso disorganizzato), comportamento grossolanamente disorganizzato ed esperienze di passività e controllo, sintomi negativi come affetto e avolizione smussato o piatto e disturbi psicomotori. 
    I sintomi si verificano con frequenza e intensità sufficienti per deviare dalle norme culturali o subculturali previste. Questi sintomi non si presentano come caratteristica di un altro disturbo mentale e comportamentale (ad esempio, un disturbo dell'umore, delirio o un disturbo dovuto all'uso di sostanze). 
    Le categorie di questo raggruppamento non dovrebbero essere utilizzate per classificare l'espressione di idee, credenze o comportamenti che sono culturalmente sanzionati.
requisiti diagnostici: >
    La schizofrenia o altri disturbi psicotici primari è un raggruppamento di disturbi caratterizzati da menomazioni significative nei test della realtà e alterazioni del comportamento come manifestati da sintomi come deliri, allucinazioni, disturbo formale del pensiero (tipicamente manifestato come discorso disorganizzato) e comportamento disorganizzato. 
    Possono essere accompagnati da disturbi psicomotori e sintomi negativi come l'affetto smussato o piatto. 
    Questi sintomi non si verificano principalmente a causa dell'uso di sostanze (ad esempio, intossicazione da allucinogeni) o di un'altra condizione medica non classificata sotto disturbi mentali, comportamentali o dello sviluppo neurologico (ad esempio, malattia di Huntington). I disturbi in questo raggruppamento sono indicati come disturbi psicotici primari perché i sintomi psicotici sono la loro caratteristica distintiva. 
    I sintomi psicotici possono verificarsi anche nel contesto di altri disturbi mentali (ad esempio, nei disturbi dell'umore o nella demenza), ma in questi casi i sintomi si verificano insieme ad altre caratteristiche di tali disturbi. 
    Mentre le esperienze di perdita/distorsione della realtà si verificano su un continuum e possono essere trovate in tutta la popolazione, i disturbi in questo gruppo rappresentano modelli di sintomi e comportamenti che si verificano con frequenza e intensità sufficienti per deviare dalle aspettative culturali o subculturali previste.
sottocategorie:
  - Schizofrenia
  - Disturbo schizoaffettivo
  - Disturbo schizofrenico
  - Disturbo psicotico acuto e transitorio
  - Disturbo delirante
  - Manifestanti sintomatiche dei disturbi psicotici primari