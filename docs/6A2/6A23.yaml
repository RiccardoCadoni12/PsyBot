disturbo: Disturbo psicotico acuto e transitorio 
codice: 6A23
gruppo_superiore: Schizofrenia o altri disturbi psicotici primari
livello: 2
descrizione: >
    Il disturbo psicotico acuto e transitorio è caratterizzato dall'insorgenza acuta di sintomi psicotici che emergono senza un prodromo e raggiungono la loro massima gravità entro due settimane. 
    I sintomi possono includere deliri, allucinazioni, disorganizzazione dei processi di pensiero, perplessità o confusione e disturbi dell'affetto e dell'umore. 
    Possono essere presenti disturbi psicomotori simili a catatonia. 
    I sintomi in genere cambiano rapidamente, sia per natura che per intensità, di giorno in giorno, o anche entro un solo giorno. 
    La durata dell'episodio non supera i 3 mesi e più comunemente dura da pochi giorni a 1 mese. 
    I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio un tumore al cervello) e non sono dovuti all'effetto di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio corticosteroidi), compreso l'astinenza (ad esempio l'astinenza da alcol).
requisiti diagnostici: >
    Insorgenza acuta di sintomi psicotici, che possono includere deliri, allucinazioni, pensiero disorganizzato o esperienze di influenza, passività o controllo, che emergono senza un prodromo, procedendo da uno stato non psicotico a uno stato chiaramente psicotico entro 2 settimane. 
    Possono essere presenti anche disturbi psicomotori, tra cui catatonia.
    I sintomi cambiano rapidamente, sia nella natura che nell'intensità. 
    Tali cambiamenti possono verificarsi di giorno in giorno, o anche entro un solo giorno.
    Assenza di sintomi negativi (cioè appiattimento affettivo, alogia o scarsità di parola, avolizione, asocialità, anedonia) durante l'episodio psicotico.
    La durata dei sintomi non supera i 3 mesi e più comunemente dura da pochi giorni a 1 mese.
    I sintomi o i comportamenti non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello), non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, corticosteroidi), compresi gli effetti di astinenza (ad esempio, dall'alcol) e non sono meglio spiegati dalla schizofrenia o da altri disturbi psicotici primari.
sottocategorie: 
  - Disturbo psicotico acuto e transitorio, primo episodio
  - Disturbo psicotico acuto e transitorio, episodi multipli