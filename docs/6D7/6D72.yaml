disturbo: Disturbo amnestico
codice: 6D72
gruppo_superiore: Disturbi neurocognitivi
livello: 2
esclusioni: 
  - Delirio
  - Demenza
  - Disturbo neurocognitivo lieve
descrizione: >
    Il disturbo amnestico è caratterizzato da un significativo deterioramento della memoria rispetto alle aspettative per l'età e al livello generale premorboso del funzionamento cognitivo, che rappresenta un declino rispetto al precedente livello di funzionamento dell'individuo, in assenza di altro significativo deterioramento cognitivo. 
    Si manifesta con un deficit nell'acquisizione, nell'apprendimento e/o nella conservazione di nuove informazioni e può includere l'incapacità di ricordare informazioni apprese in precedenza, senza disturbi della coscienza, alterazioni dello stato mentale o delirio. 
    La memoria recente è in genere più compromessa della memoria remota e la capacità di ricordare immediatamente una quantità limitata di informazioni è solitamente relativamente preservata. 
    Il deterioramento della memoria è sufficientemente grave da causare un significativo deterioramento del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Si presume che sia attribuibile a una sottostante malattia acquisita del sistema nervoso, a un trauma, a un'infezione o ad altre patologie che colpiscono il cervello, all'uso di sostanze o farmaci specifici, a carenze nutrizionali o all'esposizione a tossine, oppure l'eziologia può essere indeterminata. 
    Il deterioramento non è dovuto a intossicazione o astinenza da sostanze in atto.
requisiti diagnostici: >
    Notevole compromissione della memoria rispetto alle aspettative per età e livello generale di funzionamento neurocognitivo premorboso, in assenza di altri significativi deficit neurocognitivi.
    Il deterioramento della memoria rappresenta un netto declino rispetto ai precedenti livelli di funzionalità.
    Il deficit di memoria è caratterizzato da una ridotta capacità di acquisire, apprendere e/o conservare nuove informazioni.
    Le prove del deterioramento della memoria si basano su:
    Informazioni ottenute dall'individuo, da un informatore o dall'osservazione clinica; 
    Compromissione sostanziale delle prestazioni di memoria, come dimostrato da test neuropsicologici/cognitivi standardizzati o, in assenza di questi, da un'altra valutazione clinica quantificata.
    I sintomi non sono meglio spiegati da disturbi della coscienza, alterazione dello stato mentale, amnesia globale transitoria (vale a dire, compromissione della memoria che non dura più di 48 ore e nella maggior parte dei casi si risolve entro 6 ore), delirio, demenza, intossicazione da sostanze, astinenza da sostanze o un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario, un disturbo dell'umore, un disturbo da stress post-traumatico, un disturbo dissociativo).
    I sintomi determinano una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Se il funzionamento viene mantenuto, è solo attraverso un significativo sforzo aggiuntivo (ad esempio, strategie compensatorie).
sottocategorie:
- Disturbo amnestico dovuto a malattie classificate altrove
- Disturbo amnestico dovuto a sostanze psicoattive, compresi i farmaci