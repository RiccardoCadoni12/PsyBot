disturbo: Disturbo neurocognitivo lieve 
codice: 6D71
gruppo_superiore: Disturbi neurocognitivi
livello: 2
descrizione: >
    Il disturbo neurocognitivo lieve è caratterizzato da una lieve compromissione in uno o più domini cognitivi rispetto a quanto atteso in base all'età dell'individuo e al livello generale premorboso di funzionamento cognitivo, che rappresenta un declino rispetto al precedente livello di funzionamento dell'individuo. 
    La diagnosi si basa sul resoconto del paziente, di un informatore o sull'osservazione clinica, ed è accompagnata da evidenze oggettive di compromissione mediante valutazione clinica quantificata o test cognitivi standardizzati. 
    Il deterioramento cognitivo non è sufficientemente grave da interferire significativamente con la capacità di un individuo di svolgere attività relative al funzionamento personale, familiare, sociale, educativo e/o lavorativo o ad altre aree funzionali importanti. 
    Il deterioramento cognitivo non è attribuibile al normale invecchiamento e può essere statico, progressivo o può risolversi o migliorare a seconda della causa sottostante o del trattamento. 
    Il deterioramento cognitivo può essere attribuibile a una malattia acquisita sottostante del sistema nervoso, a un trauma, a un'infezione o ad altre patologie che colpiscono il cervello, all'uso di sostanze o farmaci specifici, a carenze nutrizionali o all'esposizione a tossine, oppure l'eziologia può essere indeterminata. 
    Il deterioramento non è dovuto a intossicazione o astinenza da sostanze in atto.
requisiti diagnostici: >
    Presenza di lieve compromissione in uno o più domini cognitivi (ad esempio attenzione, funzione esecutiva, linguaggio, memoria, capacità percettivo-motorie, cognizione sociale) rispetto alle aspettative per età e livello premorboso generale del funzionamento neurocognitivo.
    La compromissione rappresenta un declino rispetto al precedente livello di funzionamento dell'individuo.
    Il deterioramento neurocognitivo non è abbastanza grave da interferire in modo significativo con la capacità di un individuo di svolgere attività legate al funzionamento personale, familiare, sociale, educativo e/o lavorativo o ad altre aree funzionali importanti.
    La prova di un lieve deterioramento neurocognitivo si basa su:
    Informazioni ottenute dall'individuo, dall'informatore o dall'osservazione clinica; 
    Evidenza oggettiva di compromissione come dimostrato da test neuropsicologici/cognitivi standardizzati o, in assenza di questi, da un'altra valutazione clinica quantificata.
    Il deterioramento neurocognitivo non è attribuibile al normale invecchiamento.
    Il deterioramento neurocognitivo può essere attribuibile a una malattia acquisita sottostante del sistema nervoso, a un trauma, a un'infezione o ad altre patologie che colpiscono il cervello, all'uso di sostanze o farmaci specifici, a carenze nutrizionali o all'esposizione a tossine, oppure l'eziologia può essere indeterminata.
    I sintomi non sono meglio spiegati da un altro disturbo neurocognitivo, da un'intossicazione da sostanze o da un'astinenza da sostanze, o da un altro disturbo mentale (ad esempio, disturbo da deficit di attenzione e iperattività o altro disturbo dello sviluppo neurologico, schizofrenia o altro disturbo psicotico primario, un disturbo dell'umore, un disturbo da stress post-traumatico, un disturbo dissociativo).