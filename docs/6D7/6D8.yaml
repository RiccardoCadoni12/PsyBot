disturbo: Demenza
gruppo_superiore: Disturbi neurocognitivi
livello: 2
inclusioni: Demenza NAS
esclusioni: 
  - Coma
  - Delirio 
  - Disturbi dello sviluppo intellettivo
  - Disturbi dello sviluppo neurologico 
  - Stupore 
  - Declino della capacità intrinseca associato all’invecchiamento 
descrizione: >
    La demenza è caratterizzata dalla presenza di un marcato deterioramento in due o più domini cognitivi rispetto a quanto atteso in base all'età dell'individuo e al livello generale premorboso di funzionamento cognitivo, che rappresenta un declino rispetto al precedente livello di funzionamento dell'individuo. 
    Il deterioramento della memoria è presente nella maggior parte delle forme di demenza, ma il deterioramento cognitivo non si limita alla memoria (vale a dire, vi è compromissione in altre aree come le funzioni esecutive, l'attenzione, il linguaggio, la cognizione sociale e il giudizio, la velocità psicomotoria, le capacità visuo-percettive o visuo-spaziali). 
    Possono essere presenti anche alterazioni neurocomportamentali e, in alcune forme di demenza, possono essere il sintomo di presentazione. 
    Il deterioramento cognitivo non è attribuibile al normale invecchiamento ed è sufficientemente grave da interferire significativamente con l'indipendenza nello svolgimento delle attività quotidiane di un individuo. 
    Si presume che il deterioramento cognitivo sia attribuibile a una malattia acquisita sottostante del sistema nervoso, a un trauma, a un'infezione o ad altre patologie che colpiscono il cervello, o all'uso di sostanze o farmaci specifici, a carenze nutrizionali o all'esposizione a tossine, oppure l'eziologia può essere indeterminata. 
    La compromissione non è dovuta a intossicazione o astinenza da sostanze in atto.
requisiti diagnostici: >
    Marcata compromissione di due o più domini cognitivi rispetto a quella prevista in base all'età dell'individuo e al livello premorboso generale del funzionamento neurocognitivo, che rappresenta un declino rispetto al precedente livello di funzionamento dell'individuo.
    Il deterioramento della memoria è presente nella maggior parte delle forme di demenza, ma il deterioramento neurocognitivo non è limitato alla memoria e può essere presente in altri domini cognitivi come le funzioni esecutive, l'attenzione, il linguaggio, la cognizione sociale e il giudizio, la velocità psicomotoria e il funzionamento visuo-percettivo o visuo-spaziale.
    La prova del deterioramento neurocognitivo si basa su:
    Informazioni ottenute dall'individuo, dall'informatore o dall'osservazione clinica; 
    Compromissione sostanziale delle prestazioni di memoria, come dimostrato da test neuropsicologici/cognitivi standardizzati o, in assenza di questi, da un'altra valutazione clinica quantificata.
    Possono essere presenti anche cambiamenti comportamentali (ad esempio cambiamenti di personalità, disinibizione, agitazione, irritabilità) che, in alcune forme di demenza, possono essere il sintomo di presentazione.
    I sintomi non sono meglio spiegati da disturbi della coscienza o alterazioni dello stato mentale (ad esempio, dovuti a crisi convulsive, trauma cranico, ictus o effetti di farmaci), delirium, intossicazione da sostanze, astinenza da sostanze o un altro disturbo mentale (ad esempio, schizofrenia o altro disturbo psicotico primario, un disturbo dell'umore, un disturbo da stress post-traumatico, un disturbo dissociativo).
    I sintomi determinano una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altri ambiti importanti.
sottocategorie:
  - Demenza dovuta al morbo di Alzheimer
  - Demenza dovuta a malattia cerebrovascolare
  - Demenza dovuta alla malattia da corpi di Lewy
  - Demenza frontotemporale
  - Demenza dovuta a sostanze psicoattive, compresi i farmaci
  - Demenza dovuta a malattie classificate altrove
  - Disturbi comportamentali o psicologici nella demenza