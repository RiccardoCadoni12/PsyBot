disturbo: Disturbi del disagio corporeo o dell'esperienza corporea
livello: 1
esclusioni: 
  - Disturbo dissociativo da sintomi neurologici 
  - Preoccupazione per l’aspetto corporeo
descrizione: >
    I disturbi da sofferenza corporea e dell'esperienza corporea sono caratterizzati da alterazioni nell'esperienza corporea. 
    Il disturbo da sofferenza corporea riguarda sintomi corporei che l'individuo trova angoscianti e a cui è rivolta un'attenzione eccessiva. 
    La disforia dell'integrità corporea comporta un'alterazione nell'esperienza corporea che si manifesta con il desiderio persistente di avere una specifica disabilità fisica accompagnato da un disagio persistente o da intensi sentimenti di inadeguatezza rispetto all'attuale configurazione corporea non disabile.
requisiti diagnostici: >
    I disturbi da disagio corporeo o dell'esperienza corporea sono caratterizzati da alterazioni nell'esperienza corporea. 
    Il disturbo da disagio corporeo comporta sintomi corporei che l'individuo trova angoscianti e a cui è rivolta un'attenzione eccessiva. 
    La disforia dell'integrità corporea comporta un'alterazione nell'esperienza corporea che si manifesta con il desiderio persistente di avere una specifica disabilità fisica accompagnato da persistente disagio o intensi sentimenti di inadeguatezza rispetto all'attuale configurazione corporea non disabile.
sottocategorie:
  - Disturbo da sofferenza corporea
  - Disforia dell'integrità corporea