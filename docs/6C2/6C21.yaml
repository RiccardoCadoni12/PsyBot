disturbo: Disforia dell'integrità corporea
codice: 6C21 
gruppo_superiore: Disturbi del disagio corporeo o dell'esperienza corporea
livello: 2
esclusioni: Incongruenza di genere nell'adolescenza o nell'età adulta 
descrizione: >
    La disforia dell'integrità corporea è caratterizzata da un desiderio intenso e persistente di diventare fisicamente disabile in modo significativo (ad esempio, amputazione di un arto maggiore, paraplegia, cecità), con esordio nella prima adolescenza, accompagnato da disagio persistente o da intensi sentimenti di inadeguatezza rispetto all'attuale configurazione corporea non disabile. 
    Il desiderio di diventare fisicamente disabile comporta conseguenze dannose, come manifestato dalla preoccupazione per il desiderio (incluso il tempo trascorso a fingere di essere disabile) che interferisce significativamente con la produttività, con le attività del tempo libero o con il funzionamento sociale (ad esempio, la persona non è disposta ad avere una relazione stretta perché renderebbe difficile fingere) o da tentativi di diventare effettivamente disabile che hanno portato la persona a mettere in serio pericolo la propria salute o vita. 
    Il disturbo non è meglio spiegato da un altro disturbo mentale, comportamentale o del neurosviluppo, da una malattia del sistema nervoso o da un'altra condizione medica, o da simulazione.
requisiti diagnostici: >
    Un desiderio intenso e persistente di diventare fisicamente disabile in modo significativo (ad esempio, un'amputazione importante di un arto, paraplegia, cecità) accompagnato da disagio persistente o sentimenti negativi intensi riguardo alla propria attuale configurazione o funzionalità corporea.
    Il desiderio di essere disabili comporta conseguenze dannose, che si manifestano attraverso uno o entrambi i seguenti fattori:
    I tentativi di diventare effettivamente disabili attraverso l'autolesionismo hanno messo seriamente a repentaglio la propria salute o la propria vita.
    La preoccupazione per il desiderio di essere disabili comporta una compromissione significativa del funzionamento personale, familiare, sociale, educativo, occupazionale o di altre aree importanti (ad esempio, evitamento di relazioni strette, interferenza con la produttività lavorativa).
    Il desiderio persistente di essere disabili si manifesta nella prima adolescenza.
    Il disturbo non è meglio spiegato da un altro disturbo mentale (ad es., schizofrenia o altro disturbo psicotico primario, in cui, ad esempio, può essere presente una convinzione delirante che l'arto appartenga a un'altra persona, disturbo fittizio) o dalla simulazione.
    I sintomi o comportamenti non sono meglio spiegabili con l'incongruenza di genere, una malattia del sistema nervoso o un'altra condizione medica.