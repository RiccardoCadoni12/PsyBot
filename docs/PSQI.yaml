Questionario: PSQI
descrizione: >
  Il Pittsburgh Sleep Quality Index (PSQI), sviluppato nel 1989 presso l'Università di Pittsburgh, 
  è un questionario autovalutativo che misura la qualità del sonno nel corso dell'ultimo mese. 
  Composto da 19 domande e 5 domande opzionali per un partner di letto, valuta sette componenti del sonno, 
  tra cui durata, latenza e disturbi. Ogni componente è valutato su una scala da 0 a 3, 
  con un punteggio globale che varia da 0 a 21. Un punteggio superiore a 5 indica una qualità del sonno compromessa. 

cosa_misura: qualità del sonno
valore_minimo: 0
valore_massimo: 21
valori_di_riferimento: Un punteggio maggiore 5 suggerisce significative difficoltà nel sonno. 