Questionario: PSQI
descrizione: >
 The Pittsburgh Sleep Quality Index (PSQI), developed in 1989 at the University of Pittsburgh,
  is a self-assessment questionnaire that measures sleep quality over the past month.
  It consists of 19 questions, plus 5 optional questions for a bed partner,
  and evaluates seven components of sleep, including duration, latency, and disturbances.
  Each component is rated on a scale from 0 to 3, resulting in a global score ranging from 0 to 21.
  A score greater than 5 indicates poor sleep quality.

cosa_misura: Sleep quality
valore_minimo: 0
valore_massimo: 21
valori_di_riferimento: A score above 5 suggests significant sleep difficulties.