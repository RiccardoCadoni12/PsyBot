disturbo: Disturbi dell'umore
livello: 1
descrizione: >
    I disturbi dell'umore si riferiscono a un raggruppamento sovraordinato di disturbi bipolari e depressivi. 
    I disturbi dell'Umore sono definiti in base a specifici tipi di episodi dell'umore e al loro andamento nel tempo.
    I principali tipi di episodi dell'umore sono l'episodio depressivo, l'episodio maniacale, l'episodio misto e l'episodio ipomaniacale. 
    Gli episodi dell'umore non sono entità diagnosticabili in modo indipendente e pertanto non hanno codici diagnostici propri. 
    Piuttosto, gli episodi dell'umore costituiscono le componenti principali della maggior parte dei disturbi depressivi e bipolari.
requisiti diagnostici: >
    Episodio depressivo:
        La presenza simultanea di almeno cinque dei seguenti sintomi caratteristici che si verificano per la maggior parte della giornata, quasi ogni giorno durante un periodo della durata di almeno 2 settimane. 
        Deve essere presente almeno un sintomo del cluster affettivo. La valutazione della presenza o dell'assenza di sintomi dovrebbe essere fatta in relazione al funzionamento tipico dell'individuo.
        Cluster affettivo:
        Umore depresso come riportato dall'individuo (ad esempio, sentirsi giù, triste) o come osservato (ad esempio, aspetto lacrimoso, sconfitto). Nei bambini e negli adolescenti l'umore depresso può manifestarsi come irritabilità.
        Interesse o piacere marcatamente diminuito nelle attività, specialmente quelle normalmente piacevoli per l'individuo. Quest'ultimo può includere una riduzione del desiderio sessuale.
        Cluster cognitivo-comportamentale:
        Capacità ridotta di concentrarsi e mantenere l'attenzione ai compiti, o marcata indecisione.
        Credenze di bassa autostima o colpa eccessiva e inappropriata che può essere manifestamente delirante. 
        Questo elemento non dovrebbe essere considerato presente se il senso di colpa o il rimprovero di sé riguarda esclusivamente l'essere depressi.
        La disperazione per il futuro.
        Pensieri ricorrenti di morte (non solo paura di morire), ideazione suicidaria ricorrente (con o senza un piano specifico) o prove di tentato suicidio.
        Cluster neurovegetativo:
        Sonno significativamente interrotto (inizio ritardato del sonno, aumento della frequenza di risveglio durante la notte o risveglio mattutino) o sonno eccessivo.
        Cambiamento significativo dell'appetito (dimino o aumentato) o significativo cambiamento di peso (aumento o perdita).
        Agitazione psicomotoria o ritardo (osservabile dagli altri, non solo sentimenti soggettivi di irrequietezza o di essere rallentati).
        Energia ridotta, stanchezza o stanchezza marcata dopo lo sforzo di un minimo sforzo.
        I sintomi non sono meglio spiegati dal lutto.
        I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, benzodiazepine), compresi gli effetti di astinenza (ad esempio, da stimolanti).
        La presentazione clinica non soddisfa i requisiti diagnostici per un episodio misto.
        Il disturbo dell'umore si traduce in una significativa compromissione in aree personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento. 
        Se il funzionamento è mantenuto, è solo attraverso uno sforzo aggiuntivo significativo.
    Episodio maniacale:
        Entrambe le seguenti caratteristiche si verificano contemporaneamente e persistono per la maggior parte della giornata, quasi ogni giorno, durante un periodo di almeno 1 settimana, a meno che non siano abbreviate da un intervento di trattamento.
        Uno stato d'animo estremo caratterizzato da euforia, irritabilità o espansività che rappresenta un cambiamento significativo rispetto all'umore tipico dell'individuo. 
        Gli individui mostrano comunemente rapidi cambiamenti tra diversi stati d'umore (ad esempio, la labilità dell'umore).
        Aumento dell'attività o un'esperienza soggettiva di maggiore energia che rappresenta un cambiamento significativo rispetto al livello tipico dell'individuo.
        Molti dei seguenti sintomi, che rappresentano un cambiamento significativo rispetto al comportamento abituale o allo stato soggettivo dell'individuo:
        Maggiore loquacità o discorso sotto pressione (una sensazione di pressione interna per essere più loquace).
        Volo di idee o esperienza di pensieri rapidi o veloci (ad esempio, i pensieri fluiscono rapidamente e, in alcuni casi, illogicamente da un'idea all'altra; la persona riferisce che i suoi pensieri sono rapidi o addirittura frenetici e ha difficoltà a rimanere sull'argomento).
        Aumento dell'autostima o grandiosità (ad esempio, l'individuo crede di poter svolgere compiti ben oltre il suo livello di abilità o che stia per diventare famoso). 
        Nelle presentazioni psicotiche della mania, questo può manifestarsi come deliri grandiose.
        Diminuzione del bisogno di sonno (ad esempio, la persona riferisce di essere in grado di funzionare con solo 2 o 3 ore di sonno), a differenza dell'insonnia, in cui un individuo vuole dormire ma non può.
        Distrazione (ad esempio, la persona non può rimanere sul compito, perché l'attenzione è attirata su stimoli ambientali irrilevanti o minori, come essere eccessivamente distratta dal rumore esterno durante una conversazione).
        Comportamento impulsivo sconsiderato (ad esempio, l'individuo persegue impulsivamente attività piacevoli senza riguardo al loro potenziale di conseguenze negative, o prende impulsivamente decisioni importanti in assenza di un'adeguata pianificazione).
        Un aumento della spinta sessuale, della socialità o dell'attività diretta agli obiettivi.
        I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, cocaina, anfetamine), compresi gli effetti di astinenza.
        La presentazione clinica non soddisfa i requisiti diagnostici per un episodio misto.
        Il disturbo dell'umore si traduce in una significativa menomazione in aree personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento, richiede un trattamento intensivo (ad esempio, ospedalizzazione) per prevenire danni a se stessi o agli altri, o è accompagnato da delusioni o allucinazioni.
    Episodio misto:
        La presenza di diversi sintomi depressivi prominenti e di diversi sintomi depressivi prominenti coerenti con quelli osservati negli episodi manici e negli episodi depressivi, che si verificano simultaneamente o si alternano molto rapidamente (di giorno in giorno o entro lo stesso giorno). 
        I sintomi devono includere uno stato d'animo alterato coerente con un episodio maniacale e/o depressivo (cioè umore depresso, disforico, euforico o espansivo) ed essere presenti per la maggior parte della giornata, quasi ogni giorno, durante un periodo di almeno 2 settimane, a meno che non siano abbreviati da un intervento di trattamento.
        Quando i sintomi maniacali predominano in un episodio misto, i sintomi depressivi comuni (contropolari) sono l'umore disforico, le convinzioni espresse di inutilità, la disperazione e l'ideazione suicidaria.
        Quando i sintomi depressivi predominano in un episodio misto, i sintomi maniaci comuni (contropolari) sono l'irritabilità, i pensieri di corsa o affollati, l'aumento della loquacità e l'aumento dell'attività.
        Quando i sintomi depressivi e maniaci si alternano rapidamente durante un episodio misto, tali fluttuazioni possono essere osservate nell'umore (ad esempio, tra euforia e tristezza o disforia), nella reattività emotiva (ad esempio, tra affetto piatto e reattività intensa o esagerata agli stimoli emotivi), nella guida (ad esempio, periodi alternati di aumento e diminuzione dell'attività, espressione verbale, desiderio sessuale o appetito) e nel funzionamento cognitivo (ad esempio, periodi di attivazione e inibizione o rallentamento dei pensieri, dell'attenzione e della memoria).
        I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, benzodiazepine), compresi gli effetti di astinenza (ad esempio, dalla cocaina).
        Il disturbo dell'umore si traduce in una significativa compromissione in aree personali, familiari, sociali, educative, professionali o in altre importanti aree di funzionamento o è accompagnato da deliri o allucinazioni.
    Epsodio ipomaniacale:
        Entrambi i seguenti sintomi si verificano contemporaneamente e persistono per la maggior parte della giornata, quasi ogni giorno, per almeno diversi giorni:
        Aumento persistente dell'umore o aumento dell'irritabilità che rappresenta un cambiamento significativo rispetto alla solita gamma di stati d'animo dell'individuo (ad esempio, il cambiamento sarebbe evidente alle persone che conoscono bene l'individuo). 
        Questo non include periodi di umore elevato o irritabile che sono contestualmente appropriati (ad esempio, umore elevato dopo il diploma di scuola o correlato all'innamoramento). 
        Si verificano comunemente rapidi cambiamenti tra i diversi stati d'umore (cioè la labilità dell'umore).
        Aumento dell'attività o un'esperienza soggettiva di maggiore energia che rappresenta un cambiamento significativo rispetto al livello tipico dell'individuo.
        Inoltre, molti dei seguenti sintomi, che rappresentano un cambiamento significativo rispetto al comportamento abituale dell'individuo (ad esempio, il cambiamento sarebbe evidente ad altri che conoscono bene l'individuo) o allo stato soggettivo.
        Maggiore loquacità o discorso sotto pressione (una sensazione di pressione interna per essere più loquace).
        Fuga di idee o esperienza di pensieri rapidi o di corsa (ad esempio, i pensieri fluiscono rapidamente da un'idea all'altra; la persona riferisce che i suoi pensieri sono rapidi o addirittura veloci e ha difficoltà a rimanere su un argomento).
        Aumento dell'autostima o grandiosità (ad esempio, l'individuo è più sicuro di sé del solito).
        Diminuzione del bisogno di dormire (ad esempio, la persona riferisce di aver bisogno di meno sonno del solito e si sente ancora ben riposata). 
        Questo differisce dall'insonnia, in cui un individuo vuole dormire ma non può.
        Distrazione (ad esempio, la persona ha difficoltà a rimanere sul compito, perché l'attenzione è attirata su stimoli ambientali irrilevanti o minori, come essere eccessivamente distratta dal rumore esterno durante una conversazione).
        Comportamento sconsiderato impulsivo (ad esempio, l'individuo persegue attività piacevoli con poco riguardo per il loro potenziale di conseguenze negative, o prende decisioni in assenza di un'adeguata pianificazione).
        Un aumento della spinta sessuale, della socialità o dell'attività diretta agli obiettivi.
        I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, cocaina, anfetamine), compresi gli effetti di astinenza (ad esempio, da stimolanti).
        La presentazione clinica non soddisfa i requisiti diagnostici per un episodio misto.
        Il disturbo dell'umore non è sufficientemente grave da causare una marcata compromissione del funzionamento professionale o delle normali attività sociali o relazioni con gli altri e non è accompagnato da delusioni o allucinazioni.
sottocategorie:
  - Disturbi bipolari o correlati
  - Disturbi depressivi
  - Presentazioni sintomatiche e di corso per gli episodi di umore nei disturbi dell'umore