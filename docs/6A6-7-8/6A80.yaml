disturbo: Presentazioni sintomatiche e del decorso degli episodi di umore nei disturbi dell'umore 
codice: 6A80
gruppo_superiore: Disturbi dell'umore
livello: 2
descrizione: >
    Queste categorie possono essere applicate per descrivere la presentazione e le caratteristiche degli episodi di alterazione dell'umore nel contesto del disturbo depressivo a episodio singolo, del disturbo depressivo ricorrente, del disturbo bipolare di tipo I o del disturbo bipolare di tipo II. 
    Queste categorie indicano la presenza di caratteristiche specifiche e importanti nella presentazione clinica o nel decorso, nell'esordio e nella tipologia degli episodi di alterazione dell'umore. 
    Queste categorie non si escludono a vicenda e possono essere aggiunte quante più possono ritenersi necessarie.
requisiti diagnostici: >
    Ulteriori specificatori possono essere applicati per descrivere un episodio di alterazione dell'umore in atto nel contesto dei Disturbi dell'Umore. 
    Questi specificatori indicano altre caratteristiche importanti della presentazione clinica o del decorso, dell'esordio e della tipologia degli Episodi di alterazione dell'umore. 
    Questi specificatori non si escludono a vicenda e possono essere aggiunti quanti più possibile. (Si noti che lo specificatore "Cicli Rapidi" è specifico dei Disturbi Bipolari di Tipo I e di Tipo II.)
sottocategorie:
  - Sintomi di ansia prominenti negli episodi di umore
  - Attacchi di panico negli episodi di umore
  - Episodio depressivo attuale persistente
  - Episodio depressivo attuale con malinconia
  - Ciclo rapido 