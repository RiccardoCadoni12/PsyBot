disturbo: Disturbi bipolari o correlati
gruppo_superiore: Disturbi dell'umore
livello: 2
descrizione: >
    I disturbi bipolari e correlati sono disturbi dell'umore episodici, definiti dalla presenza di episodi o sintomi maniacali, misti o ipomaniacali. 
    Questi episodi si alternano tipicamente, nel corso del disturbo, a episodi depressivi o periodi di sintomi depressivi.
requisiti diagnostici: >
    I disturbi bipolari o correlati sono disturbi dell'umore episodici, definiti dalla presenza di episodi o sintomi maniacali, misti o ipomaniacali. 
    Questi si alternano tipicamente, nel corso del disturbo, a episodi depressivi o periodi di sintomi depressivi.
    Poiché i sintomi del disturbo bipolare di tipo I e del disturbo bipolare di tipo II sono sostanzialmente simili, a parte la comparsa di episodi maniacali o misti nel disturbo bipolare di tipo I e di episodi ipomaniacali nel disturbo bipolare di tipo II, dopo un elenco separato delle caratteristiche essenziali per ciascuno di questi disturbi, le altre sezioni del CDDR (ad esempio, caratteristiche cliniche aggiuntive, confini con altri disturbi e condizioni) vengono fornite insieme per entrambi i disturbi.
sottocategorie:
  - Disturbo bipolare di tipo I
  - Disturbo bipolare di tipo II
  - Disturbo ciclotimico