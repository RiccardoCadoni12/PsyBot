disturbo: Disturbi depressivi
gruppo_superiore: Disturbi dell'umore
livello: 2
descrizione: >
    I disturbi depressivi sono caratterizzati da umore depresso (ad esempio, tristezza, irritabilità, senso di vuoto) o perdita di piacere, accompagnati da altri sintomi cognitivi, comportamentali o neurovegetativi che influenzano significativamente la capacità di funzionamento dell'individuo. 
    Un disturbo depressivo non dovrebbe essere diagnosticato in individui che hanno mai sperimentato un episodio maniacale, misto o ipomaniacale, che indicherebbe la presenza di un disturbo bipolare.
requisiti diagnostici: >
    I disturbi depressivi sono caratterizzati da umore depresso (ad esempio, tristezza, irritabilità, senso di vuoto) o perdita di piacere, accompagnati da altri sintomi cognitivi, comportamentali o neurovegetativi che influenzano significativamente la capacità di funzionamento dell'individuo. 
    Un disturbo depressivo non dovrebbe essere diagnosticato in individui che hanno mai sperimentato un Episodio Maniacale, Misto o Ipomaniacale, che indicherebbe la presenza di un Disturbo Bipolare.
    Poiché la presentazione del disturbo depressivo a episodio singolo è la stessa del disturbo depressivo ricorrente, fatta eccezione per la storia di episodi depressivi precedenti, dopo un elenco separato delle caratteristiche essenziali per ciascuno di questi disturbi, le altre sezioni del CDDR (ad esempio, caratteristiche cliniche aggiuntive, confini con altri disturbi e condizioni) vengono fornite insieme per entrambi i disturbi.
sottocategorie:
  - Disturbo depressivo a episodio singolo
  - Disturbo depressivo ricorrente
  - Disturbo distimico
  - Disturbo misto depressivo e d'ansia