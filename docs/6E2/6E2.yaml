disturbo: Disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio
livello: 1
descrizione: > 
    Sindromi associate alla gravidanza o al puerperio (che iniziano entro circa 6 settimane dal parto) che comportano significative alterazioni mentali e comportamentali. 
    Se i sintomi soddisfano i requisiti diagnostici per uno specifico disturbo mentale, anche tale diagnosi dovrebbe essere assegnata.
requisiti diagnostici: >
    I disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio sono sindromi associate alla gravidanza o al puerperio (che iniziano entro circa 6 settimane dal parto) che comportano significative caratteristiche mentali e comportamentali. 
    Queste diagnosi possono essere assegnate indipendentemente dal fatto che i fattori biologici correlati alla gravidanza, al parto o al puerperio siano noti come eziologicamente correlati alla sindrome. 
    Se i sintomi soddisfano i requisiti diagnostici per un altro disturbo mentale, anche tale diagnosi dovrebbe essere assegnata. 
    Queste diagnosi possono essere assegnate anche se la sindrome rappresenta una recidiva o un'esacerbazione di un disturbo preesistente.
sottocategorie:
  - Disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio, senza sintomi psicotici
  - Disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio, con sintomi psicotici