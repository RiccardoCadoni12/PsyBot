disturbo: Disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio, senza sintomi psicotici 
codice: 6E20
gruppo_superiore: Disturbi mentali o comportamentali associati alla gravidanza, al parto o al puerperio 
livello: 2
descrizione: >
    Sindrome associata alla gravidanza o al puerperio (che inizia entro circa 6 settimane dal parto) che comporta significative manifestazioni mentali e comportamentali, più comunemente sintomi depressivi. 
    La sindrome non include deliri, allucinazioni o altri sintomi psicotici. 
    Se i sintomi soddisfano i requisiti diagnostici per uno specifico disturbo mentale, anche tale diagnosi dovrebbe essere assegnata. 
    Questa designazione non deve essere utilizzata per descrivere sintomi depressivi lievi e transitori che non soddisfano i requisiti diagnostici per un episodio depressivo, che possono verificarsi subito dopo il parto (il cosiddetto "postpartum blues").
requisiti diagnostici: >
    Insorgenza di una sindrome caratterizzata da significative caratteristiche mentali e comportamentali che si verificano durante la gravidanza o il puerperio (ossia fino a circa 6 settimane dopo il parto).
    La sindrome non comprende deliri, allucinazioni o altri sintomi psicotici.
    I sintomi non sono una manifestazione di un'altra condizione medica (ad esempio, un tumore al cervello) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, benzodiazepine), compresi gli effetti dell'astinenza (ad esempio, da stimolanti).
    Il disturbo determina una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.