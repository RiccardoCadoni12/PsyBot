disturbo: Disturbi dello sviluppo intellettivo
codice: 6A00
gruppo_superiore: Disturbi dello sviluppo neurologico
livello: 2
esclusioni: Demenza
descrizione: >
    I disturbi dello sviluppo intellettivo sono un gruppo di condizioni etiologicamente eterogenee, che hanno origine nel periodo dello sviluppo e sono caratterizzate da un funzionamento intellettivo e da un comportamento adattivo significativamente inferiori alla media, pari a circa due o più deviazioni standard al di sotto della media (circa al di sotto del 2,3° percentile), sulla base di test standardizzati, somministrati individualmente e con taratura adeguata. 
    Nel caso in cui non siano disponibili test standardizzati e tarati in modo appropriato, la diagnosi dei disturbi dello sviluppo intellettivo richiede un maggiore affidamento al giudizio clinico, basato su un’adeguata valutazione di indicatori comportamentali comparabili.
requisiti diagnostici: >
    La presenza di limitazioni significative nel funzionamento intellettivo in vari domini, quali il ragionamento percettivo, la memoria di lavoro, la velocità di elaborazione e la comprensione verbale. 
    Vi è spesso una considerevole variabilità nell’entità con cui ciascuno di questi domini può risultare compromesso in un individuo.
    Ove possibile, le prestazioni dovrebbero essere misurate mediante test di funzionamento intellettivo standardizzati, somministrati individualmente e con taratura appropriata, e risultare pari a circa due o più deviazioni standard al di sotto della media (ovvero approssimativamente inferiori al 2,3° percentile).
    Nei casi in cui non siano disponibili test standardizzati e tarati in modo adeguato, la valutazione del funzionamento intellettivo richiede un maggiore affidamento al giudizio clinico, basato su evidenze e valutazioni appropriate, che possono includere anche l’utilizzo di indicatori comportamentali del funzionamento intellettivo.
    La presenza di limitazioni significative nel comportamento adattivo, che fa riferimento all’insieme di abilità concettuali, sociali e pratiche apprese e utilizzate dalle persone nella vita quotidiana.
    Le abilità concettuali includono l’applicazione della conoscenza (es. lettura, scrittura, calcolo, risoluzione di problemi e presa di decisioni) e la comunicazione;
    le abilità sociali comprendono la gestione delle interazioni e relazioni interpersonali, la responsabilità sociale, il rispetto di regole e leggi, nonché la capacità di evitare di essere vittimizzati;
    le abilità pratiche riguardano ambiti come la cura di sé, la salute e sicurezza, le abilità occupazionali, il tempo libero, l’uso del denaro, la mobilità e i trasporti, così come l’utilizzo di elettrodomestici e dispositivi tecnologici.
    Le aspettative relative al funzionamento adattivo possono variare in funzione delle richieste ambientali che cambiano con l’età.
    Ove possibile, le prestazioni dovrebbero essere misurate con test standardizzati e tarati in modo appropriato del comportamento adattivo, e il punteggio totale dovrebbe risultare pari a circa due o più deviazioni standard al di sotto della media (cioè circa al di sotto del 2,3° percentile).
    In assenza di test adeguati, la valutazione del comportamento adattivo richiede un maggiore affidamento al giudizio clinico, basato su una valutazione adeguata che può includere l’uso di indicatori comportamentali delle competenze adattive.
    L’esordio avviene durante il periodo dello sviluppo.
    Negli adulti con un disturbo dello sviluppo intellettivo che giungono all’attenzione clinica senza una diagnosi precedente, è possibile stabilire l’insorgenza in età evolutiva attraverso l’anamnesi della persona, ovvero mediante diagnosi retrospettiva.
sottocategorie: 
  - Disturbo dello sviluppo intellettivo lieve
  - Disturbo dello sviluppo intellettivo moderato
  - Disturbo dello sviluppo intellettivo grave
  - Disturbo dello sviluppo intellettivo profondo
  - Disturbo dello sviluppo intellettivo provvisorio
        