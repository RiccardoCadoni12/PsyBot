disturbo: Disturbo dello sviluppo della coordinazione motoria 
codice: 6A04
gruppo_superiore: Disturbi dello sviluppo neurologico
livello: 2
inclusioni: Disturbo della coordinazione motoria orofacciale
esclusioni: 
  - Anomalie dell'andatura o della mobilità 
  - Malattie del sistema muscoloscheletrico o del tessuto connettivo
  - Malattie del sistema nervoso
descrizione: >
    Il disturbo dello sviluppo della coordinazione motoria è caratterizzato da un ritardo significativo nell'acquisizione delle capacità motorie grossolane e fini e da una compromissione nell'esecuzione di abilità motorie coordinate che si manifestano in goffa, lentezza o imprecisione delle prestazioni motorie. 
    Le capacità motorie coordinate sono nettamente inferiori a quelle previste data l'età cronologica dell'individuo e il livello di funzionamento intellettuale. 
    L'insorgenza di difficoltà di abilità motorie coordinate si verifica durante il periodo di sviluppo ed è tipicamente evidente fin dalla prima infanzia. 
    Le difficoltà di abilità motorie coordinate causano limitazioni significative e persistenti nel funzionamento (ad esempio nelle attività della vita quotidiana, nei lavori scolastici e nelle attività professionali e ricreative). 
    Le difficoltà con le abilità motorie coordinate non sono attribuibili esclusivamente a una malattia del sistema nervoso, a una malattia del sistema muscolo-scheletrico o del tessuto connettivo, a una compromissione sensoriale e non meglio spiegata da un disturbo dello sviluppo intellettuale.
requisiti diagnostici: >
    Ritardo significativo nell'acquisizione delle capacità motorie grossolane o fini e compromissione nell'esecuzione delle capacità motorie coordinate che si manifestano come goffaggine, lentezza o imprecisione delle prestazioni motorie.
    Le abilità motorie coordinate sono nettamente inferiori a quelle previste sulla base dell'età.
    L'insorgenza di difficoltà di abilità motorie coordinate si verifica durante il periodo di sviluppo ed è tipicamente evidente fin dalla prima infanzia.
    Le difficoltà coordinate delle abilità motorie causano limitazioni significative e persistenti nelle attività della vita quotidiana, nel lavoro scolastico, nelle attività di vocazione e nel tempo libero o in altre importanti aree di funzionamento.
    Le difficoltà con le abilità motorie coordinate non sono meglio spiegate da una malattia del sistema nervoso, una malattia del sistema muscolo-scheletrico o del tessuto connettivo, una compromissione sensoriale o un disturbo dello sviluppo intellettuale.