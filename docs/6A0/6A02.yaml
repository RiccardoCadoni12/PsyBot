disturbo: Disturbo dello spettro autistico
codice: 6A02
gruppo_superiore: Disturbi dello sviluppo neurologico
livello: 2
inclusioni: Disturbo autistico
esclusioni: Sindrome di Rett
descrizione: >
    Il disturbo dello spettro autistico è caratterizzato da deficit persistenti nella capacità di avviare e sostenere l'interazione sociale reciproca e la comunicazione sociale, e da una serie di modelli di comportamento, interessi o attività ristretti, ripetitivi e inflessibili che sono chiaramente atipici o eccessivi per l'età e il contesto socioculturale dell'individuo. 
    L'insorgenza del disturbo si verifica durante il periodo di sviluppo, in genere nella prima infanzia, ma i sintomi potrebbero non manifestarsi completamente fino a più tardi, quando le richieste sociali superano le capacità limitate. 
    I deficit sono sufficientemente gravi da causare compromissione in aree di funzionamento personali, familiari, sociali, educative, occupazionali o altre importanti e di solito sono una caratteristica pervasiva del funzionamento dell'individuo osservabile in tutte le impostazioni, anche se possono variare a seconda del contesto sociale, educativo o di altro tipo. 
    Gli individui lungo lo spettro mostrano una gamma completa di funzioni intellettuali e abilità linguistiche.
requisiti diagnostici: >
    Disavanzi persistenti nell'avvio e nel mantenimento della comunicazione sociale e delle interazioni sociali reciproche che sono al di fuori dell'intervallo previsto del funzionamento tipico data l'età e il livello di sviluppo intellettuale dell'individuo. 
    Le manifestazioni specifiche di questi deficit variano in base all'età cronologica, all'abilità verbale e intellettuale e alla gravità del disturbo. Le manifestazioni possono includere limitazioni in quanto segue:
    Comprensione, interesse o risposte inappropriate alle comunicazioni sociali verbali o non verbali degli altri.
    Integrazione del linguaggio parlato con tipici segnali non verbali complementari, come contatto visivo, gesti, espressioni facciali e linguaggio del corpo. Questi comportamenti non verbali possono anche essere ridotti in frequenza o intensità.
    Comprensione e uso del linguaggio in contesti sociali e capacità di avviare e sostenere conversazioni sociali reciproche.
    Consapevolezza sociale, che porta a comportamenti che non sono adeguatamente modulati in base al contesto sociale.
    Capacità di immaginare e rispondere ai sentimenti, agli stati emotivi e agli atteggiamenti degli altri. Condivisione reciproca degli interessi. Capacità di creare e sostenere le tipiche relazioni tra pari.
    Modelli persistenti di comportamento, interessi o attività limitati, ripetitivi e inflessibili che sono chiaramente atipici o eccessivi per l'età e il contesto socioculturale dell'individuo. Questi possono includere:
    Mancanza di adattabilità a nuove esperienze e circostanze, con disagio associato, che può essere evocato da cambiamenti banali in un ambiente familiare o in risposta a eventi imprevisti.
    Aderenza inflessibile a particolari routine; ad esempio, queste possono essere geografiche come seguire percorsi familiari, o possono richiedere tempi precisi come i pasti o il trasporto.
    Eccessiva aderenza alle regole (ad esempio, quando si gioca).
    Modelli di comportamento ritualizzati eccessivi e persistenti (ad esempio, preoccupazione per la allineamento o l'ordinamento degli oggetti in un modo particolare) che non servono a uno scopo esterno apparente.
    Movimenti motori ripetitivi e stereotipati, come movimenti di tutto il corpo (ad esempio, dondolo), andatura atipica (ad esempio, camminare in punta di piedi), movimenti insoliti della mano o delle dita e postura. 
    Questi comportamenti sono particolarmente comuni durante la prima infanzia.
    Preoccupazione persistente di uno o più interessi speciali, parti di oggetti o tipi specifici di stimoli (compresi i media) o un attaccamento insolitamente forte a oggetti particolari (esclusi i comfort tipici).
    Ipersensibilità eccessiva e persistente per tutta la vita o iposensibilità agli stimoli sensoriali o interesse insolito per uno stimolo sensoriale, che può includere suoni reali o previsti, luce, trame (specialmente vestiti e cibo), odori e sapori, caldo, freddo o dolore.
    L'insorgenza del disturbo si verifica durante il periodo di sviluppo, tipicamente nella prima infanzia, ma i sintomi caratteristici potrebbero non manifestarsi completamente fino a più tardi, quando le richieste sociali superano le capacità limitate.
    I sintomi provocano una significativa compromissione in aree di funzionamento personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento. 
    Alcuni individui con disturbo dello spettro autistico sono in grado di funzionare adeguatamente in molti contesti attraverso uno sforzo eccezionale, in modo tale che i loro deficit potrebbero non essere evidenti agli altri. 
    Una diagnosi di disturbo dello spettro autistico è ancora appropriata in tali casi.
sottocategorie: 
  - Disturbo dello spettro autistico senza disturbo dello sviluppo intellettuale e con lieve o nessuna compromissione del linguaggio funzionale
  - Disturbo dello spettro autistico con disturbo dello sviluppo intellettuale e con lieve o nessuna compromissione del linguaggio funzionale
  - Disturbo dello spettro autistico senza disturbo dello sviluppo intellettuale e con linguaggio funzionale compromesso
  - Disturbo dello spettro autistico con disturbo dello sviluppo intellettuale e con linguaggio funzionale compromesso
  - Disturbo dello spettro autistico con disturbo dello sviluppo intellettuale e con assenza di linguaggio funzionale
        