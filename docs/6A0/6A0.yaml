disturbo: Disturbi dello sviluppo neurologico
livello: 1
descrizione: >
    I disturbi dello sviluppo neurologico sono disturbi comportamentali e cognitivi che insorgono durante il periodo dello sviluppo e comportano difficoltà significative nell’acquisizione e nell’esecuzione di specifiche funzioni intellettive, motorie, linguistiche o sociali.
    Sebbene deficit comportamentali e cognitivi siano presenti in molti disturbi mentali e comportamentali che possono insorgere nel periodo dello sviluppo (es. Schizofrenia, Disturbo Bipolare), solo i disturbi le cui caratteristiche centrali sono di natura neuroevolutiva sono inclusi in questo raggruppamento.
    L’eziologia presunta dei disturbi dello sviluppo neurologico è complessa e, in molti casi individuali, sconosciuta.
requisiti diagnostici: >
    I disturbi dello sviluppo neurologico sono disturbi comportamentali e cognitivi che insorgono durante il periodo dello sviluppo e comportano difficoltà significative nell’acquisizione e nell’esecuzione di specifiche funzioni intellettive, motorie, linguistiche o sociali.
    In questo contesto, l’insorgenza nel periodo dello sviluppo è generalmente intesa come l’inizio del disturbo prima dei 18 anni di età, indipendentemente dall’età in cui l’individuo riceve per la prima volta attenzione clinica.
    Sebbene i deficit comportamentali e cognitivi siano presenti in molti disturbi mentali e comportamentali che possono insorgere durante il periodo dello sviluppo (ad es. Schizofrenia, Disturbo Bipolare), solo i disturbi le cui caratteristiche centrali sono di natura neuroevolutiva sono inclusi in questo raggruppamento.
    L’eziologia presunta dei disturbi dello sviluppo neurologico è complessa e, in molti casi individuali, sconosciuta, ma si ritiene che siano principalmente dovuti a fattori genetici o ad altri fattori presenti sin dalla nascita.
    Tuttavia, anche la mancanza di una stimolazione ambientale adeguata o di opportunità ed esperienze di apprendimento appropriate può contribuire allo sviluppo di questi disturbi, e tali fattori dovrebbero essere regolarmente considerati nella valutazione clinica.
    Alcuni disturbi dello sviluppo neurologico possono inoltre derivare da lesioni, malattie o altri danni al sistema nervoso centrale, se tali eventi si verificano durante il periodo dello sviluppo.
sottocategorie:
  - Disturbi dello sviluppo intellettivo
  - Disturbi dello sviluppo del linguaggio e della comunicazione
  - Disturbo dello spettro dell'autismo
  - Disturbo dello sviluppo dell’apprendimento
  - Disturbo dello sviluppo della coordinazione motoria
  - Disturbo da deficit di attenzione/iperattività (ADHD)
  - Disturbo da movimenti stereotipati