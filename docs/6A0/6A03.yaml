disturbo: Disturbo dello sviluppo dell’apprendimento
codice: 6A03
gruppo_superiore: Disturbi dello sviluppo neurologico
livello: 2
inclusioni: Disfunzioni simboliche
descrizione: >
    Il disturbo dello sviluppo dell'apprendimento è caratterizzato da difficoltà significative e persistenti nell'apprendimento delle abilità accademiche, che possono includere la lettura, la scrittura o l'aritmetica. 
    Le prestazioni dell'individuo nelle abilità accademiche interessate sono notevolmente inferiori a quelle che ci si aspetterebbe per l'età cronologica e il livello generale di funzionamento intellettuale, e si traduce in una significativa compromissione del funzionamento accademico o professionale dell'individuo. 
    Il disturbo dello sviluppo dell'apprendimento si manifesta per la prima volta quando le abilità accademiche vengono insegnate durante i primi anni scolastici. 
    Il disturbo dello sviluppo dell'apprendimento non è dovuto a un disturbo dello sviluppo intellettuale, alla compromissione sensoriale (visiva o uditiva), a un disturbo neurologico o motorio, alla mancanza di disponibilità di istruzione, alla mancanza di competenza nella lingua dell'istruzione accademica o alle avversità psicosociali.
requisiti diagnostici: >
    La presenza di limitazioni significative nell'apprendimento delle abilità accademiche di lettura, scrittura o aritmetica, con conseguente livello di abilità nettamente inferiore a quello che ci si aspetterebbe per l'età. 
    I limiti nell'apprendimento si manifestano nonostante l'adeguata istruzione accademica nelle aree pertinenti. 
    Le limitazioni possono essere limitate a un singolo componente di un'abilità (ad esempio, un'incapacità di padroneggiare la matematica di base o di decodificare singole parole in modo accurato e fluente) o influenzare tutta la lettura, la scrittura e l'aritmetica. 
    Idealmente, le limitazioni sono misurate utilizzando test adeguatamente normati e standardizzati.
    L'inizio delle limitazioni si verifica in genere durante i primi anni scolastici, ma in alcuni individui non può essere identificato fino a più tardi nella vita, anche nell'età adulta, quando le richieste di prestazioni relative all'apprendimento superano le capacità limitate.
    Le limitazioni non sono attribuibili a fattori esterni, come lo svantaggio economico o ambientale o la mancanza di accesso alle opportunità educative.
    Le difficoltà di apprendimento non sono meglio spiegate da un disturbo dello sviluppo intellettuale o da un altro disturbo dello sviluppo neurologico o da un'altra condizione come un disturbo motorio o un disturbo sensoriale della vista o dell'udito.
    Le difficoltà di apprendimento si traducono in una significativa compromissione delle aree accademiche, professionali o di funzionamento dell'individuo. 
    Se il funzionamento è mantenuto, è solo attraverso uno sforzo aggiuntivo significativo.
sottocategorie: 
  - Disturbo dello sviluppo dell'apprendimento con compromissione della lettura
  - Disturbo dello sviluppo dell'apprendimento con compromissione dell'espressione scritta
  - Disturbo dello sviluppo dell'apprendimento con compromissione in matematica
  - Disturbo dello sviluppo dell'apprendimento con altra compromissione specifica dell'apprendimento