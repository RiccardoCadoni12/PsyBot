disturbo: Disturbo dismorfico del corpo
codice: 6B21
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
livello: 2
esclusioni:
  - Anoressia nervosa
  - Disturbo da disagio corporeo 
  - Preoccupazione per l'aspetto del corpo
descrizione: >
    Il disturbo dismorfico del corpo è caratterizzato da una preoccupazione persistente per uno o più difetti o difetti percepiti nell'aspetto che sono impercettibili o solo leggermente evidenti agli altri. 
    Gli individui sperimentano un'eccessiva consapevolezza di sé, spesso con idee di riferimento (cioè la convinzione che le persone stiano prendendo atto, giudicando o parlando del difetto o del difetto percepito). 
    In risposta alla loro preoccupazione, gli individui si impegnano in comportamenti ripetitivi ed eccessivi che includono un esame ripetuto dell'aspetto o della gravità del difetto o del difetto percepito, tentativi eccessivi di camuffare o alterare il difetto percepito o un marcato evitamento di situazioni sociali o fattori scatenanti che aumentano l'angoscia per il difetto o il difetto percepito. 
    I sintomi sono sufficientemente gravi da provocare un disagio significativo o una significativa menomazione nelle aree personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento.
requisiti diagnostici: >
    La preoccupazione persistente per uno o più difetti o difetti percepiti nell'aspetto, o bruttezza in generale, che è impercettibile o solo leggermente evidente agli altri.
    Eccessiva consapevolezza di sé riguardo ai difetti o difetti percepiti, spesso includendo idee di autoreferenza (cioè la convinzione che le persone stiano prendendo atto, giudicando o parlando dei difetti o dei difetti percepiti).
    La preoccupazione o l'autocoscienza è accompagnata da uno dei seguenti:
    Comportamenti ripetitivi ed eccessivi, come l'esame ripetuto dell'aspetto o della gravità dei difetti o dei difetti percepiti (ad esempio, controllando le superfici riflettenti) o il confronto della caratteristica pertinente con quella degli altri;
    Tentativi eccessivi di camuffare o alterare il difetto percepito (ad esempio, forme specifiche ed elaborate di abbigliamento, sottoposti a procedure chirurgiche cosmetiche sconsiderate);
    Evitamento marcato di situazioni o stimoli sociali o di altro tipo che aumentano l'angoscia per i difetti o difetti percepiti (ad esempio, superfici riflettenti, spogliatoi, piscine).
    I sintomi non sono una manifestazione di un'altra condizione medica e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti di astinenza.
    I sintomi provocano un disagio significativo o una perdita significativa in aree di funzionamento personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento. 
    Se il funzionamento è mantenuto, è solo attraverso uno sforzo aggiuntivo significativo.
sottocategorie:
  - Disturbo dismorfico del corpo con insight buono o discreto
  - Disturbo dismorfico del corpo con insight scarso o assente