disturbo: Disturbo di riferimento olfattivo
codice: 6B22
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
livello: 2
descrizione: >
    Il disturbo di riferimento olfattivo è caratterizzato da una preoccupazione persistente con la convinzione che si stia emettendo un odore corporeo percepito o offensivo o un respiro che è impercettibile o solo leggermente evidente agli altri. 
    Gli individui sperimentano un'eccessiva consapevolezza di sé riguardo all'odore percepito, spesso con idee di riferimento (cioè la convinzione che le persone stiano notando, giudicando o parlando dell'odore). 
    In risposta alla loro preoccupazione, gli individui si impegnano in comportamenti ripetitivi ed eccessivi come controllare ripetutamente l'odore corporeo o controllare la fonte percepita dell'odore, o cercare ripetutamente rassicurazione, tentativi eccessivi di camuffare, alterare o prevenire l'odore percepito, o evitare marcato situazioni sociali o fattori scatenanti che aumentano l'angoscia per l'odore cattivo o offensivo percepito. 
    I sintomi sono sufficientemente gravi da provocare un disagio significativo o una significativa menomazione nelle aree personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento.
requisiti diagnostici: >
    Preoccupazione persistente per l'emissione di un odore o respiro corporeo o offensivo (cioè, alitosi) che è impercettibile o leggermente evidente agli altri in modo tale che le preoccupazioni dell'individuo siano marcatamente sproporzionate rispetto all'odore, se ne sono percepibili.
    Eccessiva consapevolezza di sé sull'odore percepito, spesso includendo idee di autoreferenza (cioè la convinzione che le persone stiano prendendo atto, giudicando o parlando dell'odore).
    La preoccupazione o l'autocoscienza è accompagnata da uno dei seguenti:
    Comportamenti ripetitivi ed eccessivi, come controllare ripetutamente l'odore corporeo o controllare la fonte percepita dell'odore (ad esempio, abbigliamento), o cercare ripetutamente rassicurazione;
    Tentativi eccessivi di camuffare, alterare o prevenire l'odore percepito (ad esempio, usare profumo o deodorante, fare il bagno ripetuto, lavarsi i denti o cambiare i vestiti, evitare determinati alimenti);
    Evitamento marcato di situazioni o stimoli sociali o di altro tipo che aumentano l'angoscia per l'odore cattivo o offensivo percepito (ad esempio, trasporti pubblici o altre situazioni di stretta vicinanza ad altre persone).
    I sintomi non sono una manifestazione di un'altra condizione medica e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti di astinenza.
    I sintomi provocano un disagio significativo o una perdita significativa in aree di funzionamento personali, familiari, sociali, educative, professionali o altre importanti aree di funzionamento. 
    Se il funzionamento è mantenuto, è solo attraverso uno sforzo aggiuntivo significativo.
sottocategorie:
  - Disturbo di riferimento olfattivo con insight buono o discreto
  - Disturbo di riferimento olfattivo con insight scarso o assente