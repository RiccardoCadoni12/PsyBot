disturbo: Ipocondriasi 
codice: 6B23
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
livello: 2
inclusioni:
  - Nevrosi ipocondriaca
  - Disturbo d'ansia da malattia
esclusioni:
  - Disturbo dismorfico corporeo 
  - Disturbo da disagio corporeo 
  - Timore del cancro
descrizione: >
    L'ipocondriasi è caratterizzata da preoccupazione o paura persistente per la possibilità di avere una o più malattie gravi, progressive o potenzialmente letali. 
    La preoccupazione è accompagnata da: 
    1) comportamenti ripetitivi ed eccessivi correlati alla salute, come il controllo ripetuto del corpo per individuare eventuali segni di malattia, l'eccessiva quantità di tempo dedicata alla ricerca di informazioni sulla malattia temuta, la ricerca ripetuta di rassicurazioni (ad esempio, la prenotazione di molteplici visite mediche); 
    oppure 2) comportamenti di evitamento disadattivi correlati alla salute (ad esempio, l'evitamento di appuntamenti medici). 
    I sintomi causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, scolastico, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Preoccupazione o paura persistente riguardo alla possibilità di avere una o più malattie gravi, progressive o potenzialmente letali.
    La preoccupazione è accompagnata da:
    Comportamenti ripetitivi ed eccessivi correlati alla salute, come il controllo ripetuto del corpo per individuare eventuali segni di malattia, la perdita di tempo nella ricerca di informazioni sulla malattia temuta, la ricerca ripetuta di rassicurazioni (ad esempio, l'organizzazione di più consulenze mediche);
    Comportamento di evitamento disadattivo correlato alla salute (ad esempio, evita appuntamenti medici).
    I sintomi causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Il mantenimento del funzionamento è possibile solo attraverso un significativo sforzo aggiuntivo.
sottocategorie:
  - Ipocondriasi con insight buono o discreto
  - Ipocondriasi con insight scarso o assente