disturbo: Disturbo ossessivo-compulsivo 
codice: 6B20
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
inclusioni: 
  - Nevrosi ananastica
  - Nevrosi ossessiva-compulsiva
esclusioni: Comportamento ossessivo compulsivo
livello: 2
descrizione: >
    Il disturbo ossessivo-compulsivo è caratterizzato dalla presenza di ossessioni o compulsioni persistenti, o più comunemente entrambe. 
    Le ossessioni sono pensieri, immagini o impulsi/impulsi ripetitivi e persistenti, intrusivi, indesiderati e comunemente associati all'ansia. 
    L'individuo tenta di ignorare o reprimere le ossessioni o di neutralizzarle eseguendo compulsioni. 
    Le compulsioni sono comportamenti ripetitivi, inclusi atti mentali ripetitivi che l'individuo si sente spinto a compiere in risposta a un'ossessione, secondo regole rigide o per raggiungere un senso di "completezza". 
    Affinché il disturbo ossessivo-compulsivo venga diagnosticato, le ossessioni e le compulsioni devono richiedere molto tempo (ad esempio, più di un'ora al giorno) o causare un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Presenza di ossessioni e/o compulsioni persistenti.
    Le ossessioni sono pensieri ripetitivi e persistenti (ad esempio, di contaminazione), immagini (ad esempio, di scene violente) o impulsi/impulsi (ad esempio, di accoltellare qualcuno) che vengono vissuti come intrusivi e indesiderati e sono comunemente associati all'ansia. 
    L'individuo in genere cerca di ignorare o reprimere le ossessioni o di neutralizzarle mettendo in atto delle compulsioni.
    Le compulsioni sono comportamenti o rituali ripetitivi, inclusi atti mentali ripetitivi, che l'individuo si sente spinto a compiere in risposta a un'ossessione, secondo regole rigide o per raggiungere un senso di "completezza". 
    Esempi di comportamenti manifesti includono il lavaggio ripetuto, il controllo e l'ordinamento di oggetti. 
    Esempi di atti mentali analoghi includono la ripetizione mentale di frasi specifiche per prevenire esiti negativi, la revisione di un ricordo per assicurarsi di non aver causato alcun danno e il conteggio mentale di oggetti. 
    Le compulsioni non sono collegate in modo realistico all'evento temuto (ad esempio, disporre gli oggetti simmetricamente per evitare danni a una persona cara) o sono chiaramente eccessive (ad esempio, fare la doccia ogni giorno per ore per prevenire malattie).
    Le ossessioni e le compulsioni richiedono molto tempo (ad esempio, durano più di un'ora al giorno) o causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    Se il funzionamento viene mantenuto, è solo attraverso un significativo sforzo aggiuntivo.
    I sintomi o i comportamenti non sono una manifestazione di un'altra condizione medica (ad esempio, ictus ischemico dei gangli della base) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale (ad esempio, anfetamina), compresi gli effetti dell'astinenza.
sottocategorie:
  - Disturbo ossessivo-compulsivo con insight buono o discreto
  - Disturbo ossessivo-compulsivo con insight scarso o assente
