disturbo: Disturbo da accumulo
codice: 6B24
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
livello: 2
descrizione: >
    Il disturbo da accumulo compulsivo è caratterizzato dall'accumulo di beni che rende gli spazi abitativi disordinati al punto da comprometterne l'uso o la sicurezza. 
    L'accumulo si verifica sia a causa di impulsi o comportamenti ripetitivi legati all'accumulo di oggetti, sia a causa della difficoltà a disfarsi dei beni dovuta alla percezione del bisogno di conservare gli oggetti e al disagio associato al loro smaltimento. 
    Se gli spazi abitativi sono ordinati, ciò è dovuto solo all'intervento di terze parti (ad esempio, familiari, addetti alle pulizie, autorità). 
    L'accumulo può essere passivo (ad esempio, accumulo di volantini o posta in arrivo) o attivo (ad esempio, acquisizione eccessiva di oggetti gratuiti, acquistati o rubati). 
    I sintomi causano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Accumulo di beni che rende gli spazi abitativi disordinati al punto da comprometterne l'uso o la sicurezza. 
    Nota: se gli spazi abitativi sono in ordine, ciò è dovuto esclusivamente all'intervento di terzi (ad esempio, familiari, addetti alle pulizie, autorità). 
    L'accumulo si verifica a causa di entrambi i seguenti fattori:
    Impulsi o comportamenti ripetitivi legati all'accumulo di oggetti, che possono essere passivi (ad esempio, accumulo di volantini o posta in arrivo) o attivi (ad esempio, acquisizione eccessiva di oggetti gratuiti, acquistati o rubati).
    Difficoltà a disfarsi dei beni a causa della percezione della necessità di conservare oggetti e del disagio associato al fatto di disfarsene.
    I sintomi provocano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altri ambiti importanti.
sottocategorie:
  - Disturbo da accumulo con insight buono o discreto
  - Disturbo da accumulo con insight scarso o assente