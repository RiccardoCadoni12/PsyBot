disturbo: Disturbi ossessivo-compulsivi o correlati
livello: 1
descrizione: >
    I disturbi ossessivo-compulsivi e correlati sono un gruppo di disturbi caratterizzati da pensieri e comportamenti ripetitivi che si ritiene condividano similitudini nell'eziologia e nei principali fattori di validazione diagnostica. 
    Fenomeni cognitivi come ossessioni, pensieri intrusivi e preoccupazioni sono centrali in un sottoinsieme di queste condizioni (ovvero, disturbo ossessivo-compulsivo, disturbo di dismorfismo corporeo, ipocondria e disturbo da riferimento olfattivo) e sono accompagnati da comportamenti ripetitivi correlati. 
    Il disturbo da accumulo compulsivo non è associato a pensieri indesiderati intrusivi, ma è piuttosto caratterizzato da un bisogno compulsivo di accumulare beni e dal disagio correlato allo scarto di essi. 
    In questo gruppo sono inclusi anche i disturbi comportamentali ripetitivi focalizzati sul corpo, che sono principalmente caratterizzati da azioni ricorrenti e abituali dirette alla pelle (ad esempio, strapparsi i capelli, stuzzicarsi la pelle) e mancano di un aspetto cognitivo rilevante. 
    I sintomi determinano un disagio significativo o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    I disturbi ossessivo-compulsivi o correlati comprendono un gruppo di disturbi caratterizzati da pensieri e comportamenti ripetitivi. 
    Sebbene questi disturbi presentino alcune caratteristiche in comune con disturbi di altri gruppi (ad esempio, disturbi d'ansia o correlati alla paura), i disturbi inclusi nel gruppo dei disturbi ossessivo-compulsivi o correlati presentano elementi comuni sui principali validatori diagnostici e spesso si presentano contemporaneamente, il che può essere in parte correlato a fattori genetici condivisi.
    Fenomeni cognitivi come ossessioni, pensieri intrusivi e preoccupazioni sono centrali in un sottoinsieme di queste condizioni (ovvero, disturbo ossessivo-compulsivo, disturbo di dismorfismo corporeo, ipocondria e disturbo da riferimento olfattivo) e sono accompagnati da comportamenti ripetitivi correlati. 
    Il Disturbo da Accumulo Non è associato a pensieri intrusivi indesiderati, ma è piuttosto caratterizzato da un bisogno compulsivo di accumulare beni e dal disagio correlato allo scarto di essi. In questo gruppo sono inclusi anche i disturbi comportamentali ripetitivi focalizzati sul corpo, che sono principalmente caratterizzati da azioni ricorrenti e abituali dirette alla pelle (ad esempio, strapparsi i capelli, stuzzicarsi la pelle) e mancano di un aspetto cognitivo prominente.
sottocategorie:
  - Disturbo ossessivo-compulsivo
  - Disturbo dismorfico del corpo
  - Disturbo di riferimento olfattivo
  - Ipocondriasi
  - Disturbo da accumulo
  - Disturbi comportamentali ripetitivi incentrati sul corpo

