disturbo: Disturbi comportamentali ripetitivi incentrati sul corpo
codice: 6B25
gruppo_superiore: Disturbi ossessivo-compulsivi o correlati
livello: 2
descrizione: >
    I disturbi comportamentali ripetitivi focalizzati sul corpo sono caratterizzati da azioni ricorrenti e abituali dirette al tegumento (ad esempio tirare i capelli, raccogliere la pelle, mordere le labbra), tipicamente accompagnate da tentativi infruttuosi di diminuire o fermare il comportamento coinvolto, e che portano a sequele dermatologiche (ad esempio, perdita di capelli, lesioni cutanee, abrasioni delle labbra). 
    Il comportamento può verificarsi in brevi episodi sparsi durante il giorno o in periodi meno frequenti ma più sostenuti. 
    I sintomi si traducono in un disagio significativo o in una significativa compromissione in aree di funzionamento personali, familiari, sociali, educative, professionali o altre importanti.
