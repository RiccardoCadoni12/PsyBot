Questionario: PANAS
descrizione: >
  The Positive and Negative Affect Schedule (PANAS), developed by Watson, Clark, and Tellegen in 1988,
  is a questionnaire composed of 20 adjectives that measure two affective dimensions:
  Positive Affect (PA) and Negative Affect (NA).
  Each scale consists of 10 items, rated on a 5-point Likert scale.
  The Italian version has shown good reliability,
  with internal consistency coefficients ranging from 0.86 to 0.90 for the PA scale and 0.84 to 0.87 for the NA scale.
cosa_misura: Positive and negative affect
valore_minimo: 10
valore_massimo: 50
valori_di_riferimento: Higher scores indicate greater intensity of the measured affect.