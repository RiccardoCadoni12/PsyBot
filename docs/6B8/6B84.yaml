disturbo: Pica
codice: 6B84 
gruppo_superiore: Disturbi dell'alimentazione
livello: 2
descrizione: >
    La pica è caratterizzata dal consumo regolare di sostanze non nutritive, come oggetti e materiali non commestibili (ad esempio, argilla, terra, gesso, intonaco, plastica, metallo e carta) o ingredienti alimentari crudi (ad esempio, grandi quantità di sale o farina di mais), che è persistente o sufficientemente grave da richiedere attenzione clinica in un individuo che ha raggiunto un'età evolutiva in cui ci si aspetterebbe che distingua tra sostanze commestibili e non commestibili (circa 2 anni). 
    In altre parole, il comportamento causa danni alla salute, compromissione delle funzionalità o rischi significativi a causa della frequenza, quantità o natura delle sostanze o degli oggetti ingeriti.
requisiti diagnostici: >
    Consumo regolare di sostanze non nutritive, come oggetti e materiali non alimentari (ad esempio argilla, terra, gesso, intonaco, plastica, metallo e carta) o ingredienti alimentari crudi (ad esempio grandi quantità di sale o farina di mais).
    L'ingestione di sostanze non nutritive è persistente o sufficientemente grave da richiedere attenzione clinica. 
    Vale a dire, il comportamento causa danni o rischi significativi per la salute o compromissione delle funzionalità a causa della frequenza, della quantità o della natura delle sostanze o degli oggetti ingeriti.
    In base all'età e al livello di funzionamento intellettivo, ci si aspetterebbe che l'individuo distingua tra sostanze commestibili e non commestibili. 
    Nello sviluppo tipico, questo avviene intorno ai 2 anni di età.
    I sintomi o i comportamenti non sono una manifestazione di un'altra condizione medica (ad esempio, una carenza nutrizionale).