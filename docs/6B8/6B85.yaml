disturbo: Disturbo da ruminazione-rigurgito
codice: 6B85 
gruppo_superiore: Disturbi dell'alimentazione
livello: 2
esclusioni:
  - Sindrome da ruminazione dell'adulto 
  - Nausea o vomito 
descrizione: >
    Il disturbo da ruminazione-rigurgito è caratterizzato dal ritorno intenzionale e ripetuto alla bocca del cibo precedentemente deglutito (rigurgito), che può essere rimasticato e riinghiottito (ruminazione) o sputato deliberatamente (ma non come nel vomito). 
    Il comportamento di rigurgito è frequente (almeno diverse volte a settimana) e si mantiene per un periodo di almeno diverse settimane. 
    Il comportamento di rigurgito non è completamente spiegato da un'altra condizione medica che causa direttamente il rigurgito (ad esempio, stenosi esofagee o disturbi neuromuscolari che influenzano la funzionalità esofagea) o causa nausea o vomito (ad esempio, stenosi pilorica). 
    Il disturbo da ruminazione-rigurgito dovrebbe essere diagnosticato solo in individui che hanno raggiunto un'età evolutiva di almeno 2 anni.
requisiti diagnostici: >
    Il rigurgito intenzionale e ripetuto di cibo precedentemente ingerito, che può essere nuovamente masticato e inghiottito (ruminazione) oppure sputato deliberatamente (ma non come nel vomito).
    Il comportamento di rigurgito è frequente (almeno diverse volte alla settimana) e si mantiene per un periodo di almeno diverse settimane.
    La diagnosi dovrebbe essere assegnata solo a soggetti che hanno raggiunto un'età evolutiva di almeno 2 anni.
    Il comportamento di rigurgito non è una manifestazione di un'altra condizione medica che causa direttamente il rigurgito (ad esempio, stenosi esofagee o disturbi neuromuscolari che influenzano il funzionamento esofageo) o provoca nausea o vomito (ad esempio, stenosi pilorica).