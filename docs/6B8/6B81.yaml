disturbo: Bulimia nervosa
codice: 6B81 
gruppo_superiore: Disturbi dell'alimentazione
livello: 2
esclusioni: Disturbo da alimentazione incontrollata
descrizione: >
    La bulimia nervosa è caratterizzata da frequenti e ricorrenti episodi di abbuffate (ad esempio, una volta a settimana o più spesso per un periodo di almeno un mese). 
    Un episodio di abbuffata è un periodo di tempo definito durante il quale l'individuo sperimenta una perdita soggettiva di controllo sul cibo, mangiando notevolmente di più o in modo diverso dal solito e sentendosi incapace di smettere di mangiare o di limitare il tipo o la quantità di cibo ingerito. 
    L'abbuffata è accompagnata da ripetuti comportamenti compensatori inappropriati volti a prevenire l'aumento di peso (ad esempio, vomito autoindotto, uso improprio di lassativi o clisteri, esercizio fisico intenso). 
    L'individuo è preoccupato per la forma o il peso corporeo, il che influenza fortemente l'autovalutazione. 
    Vi è un marcato disagio rispetto alla modalità di abbuffata e ai comportamenti compensatori inappropriati o una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti. 
    L'individuo non soddisfa i requisiti diagnostici per l'anoressia nervosa.
requisiti diagnostici: >
    Episodi frequenti e ricorrenti di abbuffate (ad esempio, una volta a settimana o più nell'arco di almeno un mese). 
    L'abbuffata è definita come un periodo di tempo definito (ad esempio, 2 ore) durante il quale l'individuo sperimenta una perdita di controllo sul proprio comportamento alimentare e mangia notevolmente di più o in modo diverso dal solito. 
    La perdita di controllo sull'alimentazione può essere descritta dall'individuo come la sensazione di non riuscire a smettere o limitare la quantità o il tipo di cibo ingerito; la difficoltà a smettere di mangiare una volta iniziato; o la rinuncia persino a cercare di controllare il proprio comportamento alimentare perché sa che finirà per mangiare troppo.
    Ripetuti comportamenti compensatori inappropriati per prevenire l'aumento di peso (ad esempio, una volta a settimana o più volte per un periodo di almeno 1 mese). 
    Il comportamento compensatorio più comune è il vomito autoindotto, che in genere si verifica entro un'ora dall'abbuffata. 
    Altri comportamenti compensatori inappropriati includono il digiuno o l'uso di diuretici per indurre la perdita di peso, l'uso di lassativi o clisteri per ridurre l'assorbimento del cibo, l'omissione di dosi di insulina nei soggetti con diabete e l'esercizio fisico intenso per aumentare notevolmente il dispendio energetico.
    Eccessiva preoccupazione per il peso o la forma del corpo. 
    La preoccupazione per il peso o la forma, quando non esplicitamente segnalata, può manifestarsi con comportamenti come il controllo ripetuto del peso corporeo con la bilancia; il controllo ripetuto della forma del corpo con un metro a nastro o il riflesso negli specchi; il monitoraggio costante del contenuto calorico degli alimenti o la ricerca di informazioni su come perdere peso; o con comportamenti di evitamento estremo, come il rifiuto di avere specchi in casa, l'evitamento di abiti attillati o il rifiuto di conoscere il proprio peso o di acquistare abiti con una taglia specifica.
    Vi è un disagio marcato riguardo al modello di abbuffate e comportamenti compensatori inappropriati o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, occupazionale o di altre aree importanti.
    I sintomi non soddisfano i requisiti diagnostici per l'anoressia nervosa.