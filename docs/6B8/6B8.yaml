disturbo: Disturbi dell'alimentazione
livello: 1
descrizione: >
    I disturbi dell'alimentazione e dell'alimentazione comportano comportamenti alimentari anomali che non sono spiegati da altre condizioni di salute e non sono appropriati dal punto di vista dello sviluppo o culturalmente sanciti. 
    I disturbi dell'alimentazione comportano disturbi comportamentali non correlati a problemi di peso e forma corporea, come l'ingestione di sostanze non commestibili o il rigurgito volontario di cibo. 
    I disturbi dell'alimentazione comportano comportamenti alimentari anomali e una fissazione per il cibo, nonché notevoli problemi di peso e forma corporea.
requisiti diagnostici: >
    I disturbi dell'alimentazione o dell'alimentazione comportano comportamenti alimentari anomali che non sono meglio spiegati da un'altra condizione medica e non sono appropriati dal punto di vista dello sviluppo o culturalmente sanciti. 
    I disturbi dell'alimentazione comportano disturbi comportamentali non correlati a problemi di peso o forma corporea, come l'ingestione di sostanze non commestibili o il rigurgito volontario di cibo. 
    I disturbi dell'alimentazione comportano comportamenti alimentari anomali e una fissazione per il cibo, accompagnati nella maggior parte dei casi da notevoli problemi di peso o forma corporea.
sottocategorie:
  - Anoressia nervosa
  - Bulimia nervosa
  - Disturbo da alimentazione incontrollata
  - Disturbo evitante-restrittivo dell'assunzione di cibo
  - Pica
  - Disturbo da ruminazione-rigurgito