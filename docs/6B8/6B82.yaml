disturbo: Disturbo da alimentazione incontrollata
codice: 6B82 
gruppo_superiore: Disturbi dell'alimentazione
livello: 2
esclusioni: Bulimia nervosa
descrizione: >
    Il disturbo da alimentazione incontrollata è caratterizzato da frequenti e ricorrenti episodi di abbuffate (ad esempio, una volta a settimana o più volte nell'arco di diversi mesi). 
    Un episodio di abbuffata è un periodo di tempo definito durante il quale l'individuo sperimenta una perdita soggettiva di controllo sul cibo, mangiando notevolmente di più o in modo diverso dal solito e sentendosi incapace di smettere di mangiare o di limitare il tipo o la quantità di cibo ingerito. 
    L'abbuffata è vissuta come molto angosciante ed è spesso accompagnata da emozioni negative come senso di colpa o disgusto. 
    Tuttavia, a differenza della bulimia nervosa, gli episodi di abbuffata non sono regolarmente seguiti da comportamenti compensatori inappropriati volti a prevenire l'aumento di peso (ad esempio, vomito autoindotto, uso improprio di lassativi o clisteri, esercizio fisico intenso). 
    Vi è un marcato disagio rispetto alla modalità di abbuffata o una significativa compromissione del funzionamento personale, familiare, sociale, educativo, lavorativo o di altre aree importanti.
requisiti diagnostici: >
    Episodi frequenti e ricorrenti di abbuffate (ad esempio, una volta a settimana o più nell'arco di 3 mesi). 
    L'abbuffata è definita come un periodo di tempo definito (ad esempio, 2 ore) durante il quale l'individuo sperimenta una perdita di controllo sul proprio comportamento alimentare e mangia notevolmente di più o in modo diverso dal solito. 
    La perdita di controllo sull'alimentazione può essere descritta dall'individuo come la sensazione di non riuscire a smettere o limitare la quantità o il tipo di cibo ingerito; la difficoltà a smettere di mangiare una volta iniziato; o la rinuncia persino a cercare di controllare il proprio comportamento alimentare perché sa che finirà per mangiare troppo.
    Gli episodi di abbuffate compulsive non sono regolarmente accompagnati da comportamenti compensatori inappropriati volti a prevenire l'aumento di peso.
    I sintomi e i comportamenti non sono meglio attribuibili a un'altra condizione medica (ad esempio la sindrome di Prader-Willi) o a un disturbo mentale (ad esempio un disturbo depressivo) e non sono dovuti agli effetti di una sostanza o di un farmaco sul sistema nervoso centrale, compresi gli effetti dell'astinenza.
    Vi è un disagio marcato riguardo al modello di abbuffate o una compromissione significativa del funzionamento personale, familiare, sociale, educativo, lavorativo o di altri ambiti importanti.