disturbo: Tratti o modelli di personalità prominenti 
codice: 6D11
gruppo_superiore: Disturbi della personalità e tratti correlati
livello: 2
descrizione: >
    I qualificatori di dominio dei tratti possono essere applicati ai Disturbi di Personalità o alle Difficoltà di Personalità per descrivere le caratteristiche della personalità dell'individuo che sono più evidenti e che contribuiscono al disturbo di personalità. 
    I domini dei tratti sono in continuità con le caratteristiche di personalità normali negli individui che non presentano Disturbi di Personalità o Difficoltà di Personalità. 
    I domini dei tratti non sono categorie diagnostiche, ma rappresentano piuttosto un insieme di dimensioni che corrispondono alla struttura sottostante della personalità. 
    È possibile applicare tanti qualificatori di dominio dei tratti quanti ne siano necessari per descrivere il funzionamento della personalità. 
    Gli individui con un disturbo di personalità più grave tendono ad avere un numero maggiore di domini dei tratti evidenti.
requisiti diagnostici: >
    Gli specificatori di dominio dei tratti possono essere applicati ai disturbi della personalità o alle difficoltà di personalità per descrivere le caratteristiche della personalità dell'individuo che sono più evidenti e che contribuiscono al disturbo della personalità.
    I domini dei tratti sono in continuità con le caratteristiche di personalità normali negli individui che non presentano disturbo di personalità o difficoltà di personalità. 
    I domini dei tratti non sono categorie diagnostiche, ma rappresentano piuttosto un insieme di dimensioni che corrispondono alla struttura sottostante della personalità.
    È possibile applicare tutti gli specificatori di dominio dei tratti necessari per descrivere il funzionamento della personalità. 
    Gli individui con un disturbo di personalità più grave tendono ad avere un numero maggiore di domini di tratti prominenti. 
    Tuttavia, una persona può avere un disturbo di personalità grave e manifestare un solo dominio di tratti prominente (ad esempio, il Distacco).
sottocategorie:
  - Affettività negativa nel disturbo di personalità o difficoltà di personalità
  - Distacco nel disturbo di personalità o difficoltà di personalità
  - Dissocialità nel disturbo di personalità o difficoltà di personalità
  - Disinibizione nel disturbo della personalità o difficoltà di personalità
  - Anancastia nel disturbo di personalità o difficoltà di personalità
  - Pattern borderline