disturbo: Disturbi della personalità e tratti correlati
livello: 1
descrizione: >
    La personalità si riferisce al modo caratteristico di un individuo di comportarsi, di vivere la vita e di percepire e interpretare se stesso, gli altri, gli eventi e le situazioni. 
    Il Disturbo della Personalità è una marcata alterazione del funzionamento della personalità, quasi sempre associata a una notevole compromissione personale e sociale. 
requisiti diagnostici: >
    Le manifestazioni principali del Disturbo della Personalità sono compromissioni del funzionamento di aspetti del sé (ad esempio, identità, autostima, capacità di autodeterminazione) e/o problemi nel funzionamento interpersonale (ad esempio, sviluppare e mantenere relazioni strette e reciprocamente soddisfacenti, comprendere le prospettive altrui, gestire i conflitti nelle relazioni). 
    Le compromissioni del funzionamento del sé e/o del funzionamento interpersonale si manifestano in modelli disadattivi (ad esempio, inflessibili o scarsamente regolati) di cognizione, esperienza emotiva, espressione emotiva e comportamento.
sottocategorie:
  - Disturbo della personalità
  - Tratti o pattern di personalità prominenti 